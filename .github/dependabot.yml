# Standard fleet Dependabot config (weekly, grouped minor+patch) —
# repository-baseline-policy.md §4.3. Version-update PRs merge under
# auto-merge-policy.md's Dependabot lane, not by hand.
version: 2
updates:
  # `uv`, NOT `pip` — this repository's dependencies are locked in `uv.lock`,
  # and `ci.yml`'s "The lockfile agrees with pyproject.toml" step runs
  # `uv lock --check`. The `pip` ecosystem edits `pyproject.toml` and leaves
  # the lockfile alone, so every version-update PR it opened failed that step
  # and NONE could ever merge, however green the tests were.
  #
  # Measured 2026-09-09: five open bump PRs (crucible-PR175..179) all failed
  # with `error: The lockfile at uv.lock needs to be updated, but --check was
  # provided.` and nothing else. `AGENTS.md` already states the rule the
  # ecosystem was violating — "a `pyproject.toml` change lands with the
  # regenerated `uv.lock` in the same commit" — so the config, not the guard,
  # was the thing out of step.
  #
  # The `uv` ecosystem understands `uv.lock` and regenerates it in the same
  # commit. Chosen over adding a workflow that re-locks on a Dependabot PR:
  # that would be a second mechanism maintaining a file the tool can maintain
  # itself, and it would need write access on a Dependabot-triggered run.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # pandas 3 is UNRESOLVABLE here, not merely unreviewed. The `arcticdb`
    # extra pulls `nousergon-lib[arcticdb]` -> `arcticdb`, and every
    # non-yanked arcticdb release (newest 6.26.0; 6.27.0 is yanked) declares
    # `pandas<3`, on every platform. Dependabot re-locks with `pandas==3.x`,
    # uv cannot satisfy it, and the whole weekly `uv` job goes red while the
    # other updates in the same run still open their PR — measured on runs
    # 35123752417 (2026-09-16), 35890673631 (2026-09-23) and 36746299304
    # (2026-09-30). Reproduced locally: `uv lock --upgrade-package
    # pandas==3.0.6` fails on the linux split as well as win32.
    #
    # pandas 2.x minor/patch releases still arrive through this config. Remove
    # this entry when an arcticdb release drops the `pandas<3` bound — that is
    # the only event that makes the update possible, and it is visible on
    # arcticdb's PyPI metadata (`requires_dist`).
    #
    # `nousergon-lib` is ignored for a different reason: it is pinned in TWO
    # places that must move together -- `nousergon-lib[github-app,gates]` in
    # `dependencies` and `nousergon-lib[arcticdb]` in the `arcticdb` extra --
    # and Dependabot bumps each requirement separately. Either bump alone is
    # unsatisfiable (`crucible[arcticdb] depends on nousergon-lib[arcticdb]==
    # 0.124.165 and your project depends on nousergon-lib==0.124.167`), so the
    # weekly `uv` job went red on run 37654309287 (2026-10-07) with
    # `dependency_file_not_resolvable` on both requirements. First-party bumps
    # here are deliberate and land with the feature that needs the new release
    # and the regenerated `uv.lock` (see #336, #365, #378), never as a bot
    # PR. Remove this entry if the two pins are ever collapsed into one.
    ignore:
      - dependency-name: pandas
        versions: [">=3"]
      - dependency-name: nousergon-lib
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
