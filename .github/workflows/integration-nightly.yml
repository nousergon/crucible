name: Integration nightly

# `alpha-engine-config-I10419`. The third test tier: `tests/integration/`,
# one case per CLI job against a REAL dedicated S3 prefix and a REAL
# dedicated ArcticDB library — never the production ones, never per-PR. See
# `tests/integration/README.md` for the full contract, the job-by-job
# coverage table, and the deliberate deltas this workflow carries (no new
# CLI job, no gate.py staleness clause — both filed as follow-ups).
#
# `ci.yml`'s own comment names three workflows and no others in this repo;
# this is the one exception `ci.yml` predates — a fourth, added deliberately
# because the tier it runs cannot share `ci.yml`'s trigger (`pull_request`)
# without touching that file, which this PR is instructed not to do. It
# mirrors `ci.yml`/`deploy.yml`'s identity-assertion and repository-variable
# shape rather than inventing a new one (`crucible/AGENTS.md`: mirror a SOTA
# pattern already in this repo).
#
# ── Why `workflow_call` as well as `schedule` ──────────────────────────────
#
# "nightly, and before any phase gate" (I10419) is two triggers, not one. The
# nightly half is the `schedule:` below. The pre-gate half has no caller yet:
# nothing in this repo today runs `crucible gate` on a schedule (it is an
# operator/board-read action, `AGENTS.md` "Reading a gate from the laptop"),
# and wiring `gate-close.yml` or a future gate-scheduling workflow to call
# this one is `gate.py`'s owning track's decision, not this PR's — `gate.py`
# is out of this session's ownership (see the PR body). `workflow_call:` is
# exposed so that wiring is a one-line `uses:` addition to whichever workflow
# ends up owning "before any phase gate", rather than a second copy of this
# file.
#
# ── The identity, and why it does not exist yet ────────────────────────────
#
# `CRUCIBLE_INTEGRATION_ROLE_ARN` below follows the exact shape
# `ACCEPTANCE_ROLE_ARN`/`DEPLOY_ROLE_ARN` already use: built from
# `vars.CRUCIBLE_ROLE_PREFIX`, asserted after `configure-aws-credentials`
# rather than trusted, masked before it can reach this public repo's log.
# The role ITSELF — `{prefix}-integration`, scoped to exactly the dedicated
# `integration/` store prefix and the dedicated ArcticDB library, per
# `gate-close.yml`'s own precedent ("an identity is attached to a workflow,
# not to a step") — is infrastructure this session does not create: a named
# IAM role is an OPERATOR-GATED apply (`pull-request-policy` §4.2 form 3),
# same as every other role this repo depends on. Filed as
# `alpha-engine-config-I10462` (create `{prefix}-integration` in
# `nous-ergon-ops/infrastructure/cloudformation/crucible-v2.yaml`, scoped to
# `integration/*` and the dedicated ArcticDB library only — NEVER the
# production prefixes or `universe`/`macro`/`preliminary`). Until that lands
# and the seven `CRUCIBLE_INTEGRATION_*` repository variables in
# `tests/integration/README.md` are set, every run of this workflow fails at
# the "Repository variables are set" step below, loudly, naming exactly what
# is missing — never a silent no-op.

# ── The `schedule:` trigger is REMOVED, not forgotten ─────────────────────
#
# It declared `cron: '0 6 * * *'` when this file landed, and two independent
# things made that cron a defect rather than a feature (both measured
# 2026-09-10, `alpha-engine-config-I10467`):
#
# 1. **It could not have succeeded.** `crucible-v2-integration` does not
#    exist as an IAM role — `aws iam get-role` returns NoSuchEntity — and the
#    comment further down says as much: the role "is infrastructure this
#    session does not create". So the first firing, 06:00 UTC on 2026-09-11,
#    would have failed at `configure-aws-credentials`, and every one after it.
# 2. **It was unobserved.** `nous-ergon-ops`' cross-repo guard
#    `test_crucible_dispatch_lockstep.py::
#    test_every_scheduled_workflow_is_named_by_a_registry_row` went red on
#    `main` the moment this merged: no row in `crucible/components.yaml`
#    names it as a `dispatch_workflow`, and the guard's own words are "a
#    scheduled run with no row has no deadline, no absence watcher and no
#    console surface: it is unobserved, not healthy."
#
# The guard offers a row or removal, and a row is not available yet: rows in
# `components.yaml` are keyed by CLI JOB and the coverage test derives that
# table in both directions plus the schema's `job` enum, so a row for a
# workflow that runs `pytest` rather than a `crucible` job fails from the
# other side. Inventing one to quiet a guard is the shape rule 4 forbids.
#
# So the tier keeps the two triggers that work today and loses the one that
# could only have failed. `workflow_dispatch` runs it on demand;
# `workflow_call` is the pre-gate half. Re-arming the cron is
# `alpha-engine-config-I10467`, and it is gated on BOTH halves — the role
# provisioned, and the tier given a real registered surface (most likely by
# becoming a `crucible` CLI job that writes a manifest, which is what the
# guard is actually arguing for and what would earn it a deadline, an
# absence watcher and a console row).
on:
  workflow_dispatch: {}
  workflow_call:
    outputs:
      outcome:
        description: 'ok or failed, from the integration summary this run wrote'
        value: ${{ jobs.integration.outputs.outcome }}

permissions: {}

concurrency:
  group: integration-nightly
  cancel-in-progress: false

env:
  # The fleet's ONE name for "where is this code running" (`krepis.router`,
  # `crucible.llm.EXEC_CONTEXT_ENV`) — never inferred. Every `crucible`
  # process that reaches `crucible.llm._exec_context` (the fault probe, any
  # LLM call site) refuses with `KREPIS_EXEC_CONTEXT is not set` otherwise;
  # measured against run 34797033396 (`alpha-engine-config-I10701`),
  # `crucible.fault_probe.FaultProbeFailure: routing_refusal`. `ci` is
  # `krepis.router.EXEC_CONTEXT_CI` — the value every other `crucible` test
  # that sets this var uses for a GitHub Actions runner
  # (`tests/test_llm_call_fails_closed.py`, `tests/test_chaos_probe_
  # containment.py`, `tests/faults/*`) — never `ec2`, which would tell the
  # router this runner can reach the trading box's local egress proxy.
  KREPIS_EXEC_CONTEXT: ci
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  CRUCIBLE_INTEGRATION_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.CRUCIBLE_ROLE_PREFIX }}-integration
  # The dedicated store, ArcticDB bucket/library and paging topics —
  # NEVER the production values `STORE_URI`/`DEPLOY_ROLE_ARN` resolve to in
  # `ci.yml`/`deploy.yml`. See tests/integration/README.md for the guards
  # `conftest.py` runs over each of these before a single test executes.
  CRUCIBLE_INTEGRATION_STORE_URI: ${{ vars.CRUCIBLE_INTEGRATION_STORE_URI }}
  CRUCIBLE_INTEGRATION_ARCTIC_BUCKET: ${{ vars.CRUCIBLE_INTEGRATION_ARCTIC_BUCKET }}
  CRUCIBLE_INTEGRATION_ARCTIC_LIBRARY: ${{ vars.CRUCIBLE_INTEGRATION_ARCTIC_LIBRARY }}
  CRUCIBLE_INTEGRATION_PAGES_TOPIC: ${{ vars.CRUCIBLE_INTEGRATION_PAGES_TOPIC }}
  CRUCIBLE_INTEGRATION_MUTED_TOPIC: ${{ vars.CRUCIBLE_INTEGRATION_MUTED_TOPIC }}
  # `crucible test.integration` (below) now runs a crucible command with
  # `--run-mode live`, which `tests/test_workflow_required_env.py` reads as
  # "reaches the production store" and requires every `require_env` call
  # site under `crucible/` to be declared here — even though the ONLY
  # process that actually calls `crucible.alerts`/`crucible.features.compute`
  # is the `pytest tests/integration` SUBPROCESS this job shells out to,
  # which re-derives its own `CRUCIBLE_PAGES_TOPIC`/`CRUCIBLE_MUTED_TOPIC`
  # from the `_INTEGRATION_` values above via
  # `tests/integration/conftest.py::_dedicated_topic_env` regardless of what
  # is set here. Declared anyway, pointed at the SAME dedicated values —
  # never the production ones `board.yml`/`deploy.yml`/`gate-close.yml`
  # resolve — so the static guard (correctly) cannot tell this workflow
  # apart from one that skipped declaring a var it truly needs, and so a
  # future caller of `crucible.alerts`/`crucible.features.compute` from
  # OUTSIDE the pytest subprocess is not silently pointed at production
  # either. `CRUCIBLE_LIQUIDITY_FLOOR_USD` carries no dedicated-integration
  # variant (it is a feature threshold, not an isolation boundary — the
  # library/store/topic split is) so it reuses the same repository variable
  # `board.yml`/`deploy.yml`/`gate-close.yml` already do.
  CRUCIBLE_PAGES_TOPIC: ${{ vars.CRUCIBLE_INTEGRATION_PAGES_TOPIC }}
  CRUCIBLE_MUTED_TOPIC: ${{ vars.CRUCIBLE_INTEGRATION_MUTED_TOPIC }}
  CRUCIBLE_LIQUIDITY_FLOOR_USD: ${{ vars.CRUCIBLE_LIQUIDITY_FLOOR_USD }}
  # `report.morning` (`alpha-engine-config-I10458`): the SAME fleet App SSM
  # prefix `morning-report.yml` reads, not a dedicated integration one — the
  # App is credential, not isolation, and this job's isolation is entirely
  # `tests/integration/conftest.py::_morning_destination_env` pointing
  # `CRUCIBLE_MORNING_TRACKER_REPO` at the PUBLIC `nousergon/crucible` rolling
  # issue instead of the private production tracker. A WARNING, not a hard
  # failure, below — same reasoning as `morning-report.yml`'s own check: the
  # named `TrackerError` this job raises without it is already the loud
  # failure, not a silent one this step needs to duplicate.
  CRUCIBLE_TRACKER_APP_SSM_PREFIX: ${{ vars.CRUCIBLE_TRACKER_APP_SSM_PREFIX }}

jobs:
  integration:
    name: tests/integration (real S3 + real ArcticDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    outputs:
      outcome: ${{ steps.tests.outcome == 'success' && 'ok' || 'failed' }}
    steps:
      - name: Repository variables are set
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID CRUCIBLE_INTEGRATION_STORE_URI \
                      CRUCIBLE_INTEGRATION_ARCTIC_BUCKET CRUCIBLE_INTEGRATION_ARCTIC_LIBRARY \
                      CRUCIBLE_INTEGRATION_PAGES_TOPIC CRUCIBLE_INTEGRATION_MUTED_TOPIC; do
            value="${!name}"
            if [ -z "${value}" ]; then
              echo "::error::repository variable ${name} is not set — see tests/integration/README.md, 'The dedicated environment'. Set it with: gh variable set ${name} --repo nousergon/crucible --body '<value>'"
              missing=1
            fi
          done
          # A WARNING, not a hard failure (`alpha-engine-config-I10458`,
          # mirrors `morning-report.yml`'s own check): an unset App prefix
          # means `crucible report.morning`'s tracker calls raise a named
          # `TrackerError` and that ONE case fails loudly — a real, visible
          # failure, not the silent gap this tier exists to close.
          if [ -z "${CRUCIBLE_TRACKER_APP_SSM_PREFIX}" ]; then
            echo "::warning::repository variable CRUCIBLE_TRACKER_APP_SSM_PREFIX is not set — crucible test.integration's report.morning case will fail loudly with a named TrackerError. Set it with: gh variable set CRUCIBLE_TRACKER_APP_SSM_PREFIX --repo nousergon/crucible --body '<prefix>', and grant the crucible-v2-integration role ssm:GetParameter on that prefix (alpha-engine-config-I10462's own IAM scope, extended — an operator-gated CloudFormation apply)."
          fi
          exit "${missing}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: The lockfile agrees with pyproject.toml
        run: uv lock --check

      - name: Install (with the arcticdb extra — this tier needs the real thing)
        run: uv sync --frozen --extra arcticdb

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ env.CRUCIBLE_INTEGRATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${CRUCIBLE_INTEGRATION_ROLE_ARN##*/}"
          case "${assumed}" in
            *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;;
            *) echo "::error::this job assumed ${assumed}, not ${expected}. It may act ONLY as the dedicated integration identity, scoped to the integration/ store prefix and the dedicated ArcticDB library — never the production roles this repo's other workflows assume. If the role does not exist yet, see alpha-engine-config-I10462 (an operator-gated CloudFormation apply)."; exit 1 ;;
          esac

      # `tests/integration` is deliberately never on the `pull_request` or
      # `push: [main]` trigger's own suite — `pyproject.toml`'s `addopts`
      # ignores it there. This IS its execution path.
      #
      # `crucible test.integration` (`alpha-engine-config-I10459`) is a
      # registered CLI job: a thin handler that shells to
      # `pytest tests/integration --tb=short` and writes a real
      # `run_manifest.v2` document at `runs/test.integration/{trading_day}/
      # run.json` in the dedicated store, in a `try/finally` (rule 1) — this
      # replaces the two hand-rolled steps this workflow used to carry (a
      # bare `pytest` invocation, then a raw `store.put_bytes` write of a
      # plain `integration_summary.v1` object that was never manifest-or-it-
      # didn't-happen and carried no `components.yaml` row).
      - name: Integration tier (crucible test.integration)
        id: tests
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run --frozen crucible test.integration \
            --store "$CRUCIBLE_INTEGRATION_STORE_URI" \
            --run-mode live

      - name: Fail the run if the integration tier failed
        if: steps.tests.outcome != 'success'
        run: |
          echo "::error::crucible test.integration failed — see the 'Integration tier (crucible test.integration)' step above. Its manifest (runs/test.integration/{trading_day}/run.json in the dedicated store) still recorded the failure — real telemetry, never a silently absent one."
          exit 1

  notify-failure:
    needs: [integration]
    if: failure()
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@c115e75840c5e210f857107118428beb4a6fdaa8
    secrets: inherit
