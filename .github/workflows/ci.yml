name: CI

# Plan §4.11. Target: <= 5 min per PR, <= 300 GHA minutes/month, CodeBuild $0,
# ECR $0, Inspector $0. This repository is PRIVATE today, so these minutes are
# metered; the budget above is what keeps that immaterial. It goes public at
# phase-1 exit (alpha-engine-config-I9775), and only then are they free. The
# earlier version of this comment asserted "public, so those minutes are free"
# in the present tense, which was wrong on the day it was written.
#
# Three workflows in this repo and no others (revised 2026-09-02 — plan §11
# risk 1 added `adversarial-review-gate.yml` after this comment was written;
# see that file for why it does not repeat the sixteen-workflows-per-repo
# mistake: it is two thin `gh api` calls, no checkout, no `uv sync`). Every
# guard the v1 repos carry as a per-repo workflow is a pytest in `tests/`
# here, or it is not carried: sixteen workflows per repo is how a fleet
# spends 66% of its metered CI minutes on one private repo. deploy.yml is
# track C's.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    # EVERY base branch, not just `main`. A stacked PR — the shape this
    # repository uses constantly, because a fix for an open PR's file has to
    # branch from it — targets the branch it stacks on, so `branches: [main]`
    # meant `gh pr checks` reported "no checks reported" and the PR merged
    # unmeasured. A lane where a defect lands with no CI is worse than a slow
    # lane (measured on crucible-PR8, 2026-09-01).
    branches: ['**']
    # No `paths-ignore` on pull_request, deliberately. GitHub records a
    # workflow skipped by a path filter as never having started, so a
    # docs-only PR leaves a REQUIRED check pending forever — the check never
    # goes green and never goes red, and the PR cannot merge. The filter stays
    # on `push`, where nothing is waiting on the result. The extra runs are
    # metered while the repo is private, and cost a few minutes a month
    # against the §4.11 budget.
  # NO `schedule:`, deliberately, and this is worth reading before adding one.
  #
  # A daily arm is the right shape for a gate with a live-state clause: it
  # catches what no merge can see, an account changing out of band. But the
  # `acceptance` job below holds `permissions: {contents: read}` — no OIDC, no
  # AWS credentials — so its one live-state clause (`TestCost`) cannot reach
  # the account at all and lands in the same UNMET branch a genuine failure
  # would. A cron here would regrade an unchanged tree against an unchanged
  # lockfile and return the same reading every day, forever: metered minutes
  # on a private repo buying a signal it is not able to produce.
  #
  # `alpha-engine-config-I9828` gives the job read-only OIDC and makes
  # UNMEASURABLE a distinct outcome from UNMET. The cron belongs in that
  # change, where it starts measuring something, not in this one.

# Default-deny at the workflow level; each job re-grants only what it needs.
# `contents: read` is NOT optional while this repo is private: with no
# permissions at all the token cannot see the repository, and actions/checkout
# fails with "Repository not found" — which reads like a missing repo rather
# than a missing scope. Measured 2026-09-01 on the first CI run.
permissions: {}

concurrency:
  # The event name is part of the group so that two arms sharing a ref never
  # cancel each other — a cancelled run is neither green nor red, which is the
  # one outcome nothing notices. There is no scheduled arm today (see above),
  # but the group is written so adding one does not silently reintroduce that.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + foundation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen, never a re-resolve. The lockfile is the supply chain: a CI
      # run that resolves its own dependencies has not tested what ships.
      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      # The blocking gate. tests/acceptance is excluded here and run as its
      # own reporting job below — see the comment there for why that is not a
      # suppression.
      - name: Foundation tests
        run: uv run pytest -q --ignore=tests/acceptance

      # Collection, not execution — and it belongs HERE, on the PR path.
      # Importing a test module grades the TREE: it proves every symbol
      # tests/acceptance references still exists. Running the clauses grades
      # the SYSTEM, which is why that half moved off the PR path.
      #
      # Without this, renaming a `crucible/` symbol an acceptance test imports
      # passes ruff, passes the foundation suite (which --ignores that
      # directory) and passes every other PR check, then breaks the acceptance
      # job on main at collection time. `--collect-only` executes no test body,
      # so it touches no live AWS and stays on the correct side of
      # scm-platform-policy.md §3.1.
      - name: Acceptance clauses still import
        run: uv run pytest tests/acceptance --collect-only -q

  acceptance:
    name: acceptance gate (RED until the phase exits — reporting only)
    runs-on: ubuntu-latest
    # NOT on the pull_request path — not required, not advisory, not present.
    # `scm-platform-policy.md` §3.1 (Brian ruling 2026-08-10): a check grades
    # the diff; a check whose subject is live infrastructure does not belong on
    # a PR at all. These clauses grade the SYSTEM at a phase boundary — live
    # AWS among them (`TestCost` calls cloudformation:ListStackResources) — so
    # their answer is a property of the account and the phase, never of the
    # branch under review. An author cannot clear them and is not meant to.
    #
    # Leaving them here made every PR in this repo read red, which trains the
    # operator to merge past red and destroys the value of every other check:
    # measured 2026-09-02, all seven open Dependabot PRs sat UNSTABLE on this
    # single failure, and merging any of them required a human to decide, per
    # PR, that a red check did not count.
    #
    # The reading is not lost — it moves to `push: [main]`, which is where a
    # phase gate belongs: graded minutes after each merge, with a deploy behind
    # it, rather than attributed to an author who cannot change the answer.
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    # tests/acceptance holds the plan §2 clauses written BEFORE the code that
    # satisfies them (plan §6 phase-0 exit: "acceptance tests written as
    # failing pytest"). They fail today by design and go green one at a time
    # as the tracks land.
    #
    # This is not a suppression: the tests are not skipped, not xfailed and
    # not marked — nothing in the tree hides them, and
    # tests/test_no_suppressions.py enforces that. They are RUN, in full.
    #
    # NO `continue-on-error`, and that is the point. The job does not grade
    # pass/fail on the suite — a suite red by design would page forever, which
    # is the desensitisation this whole PR removes. It grades the READING
    # against `tests/acceptance/ratchet.json` and fails the RUN on any
    # movement of the SET of unmet clauses — a clause that regressed, a clause
    # that started passing without the ratchet moving with it, or a change in
    # how many clauses exist. The set, not a count: one clause going green
    # while another regresses leaves a count unchanged, and a scalar
    # comparison then reports "unchanged" on the day something broke.
    #
    # Without this the arm was structurally incapable of signalling: a
    # job-level `continue-on-error` reports the RUN as success while the job
    # is red, so nothing downstream — mail, notify job, or a human reading the
    # runs list — can tell. A component emitting nothing is not healthy, it is
    # unobserved (principle 7).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen

      # JUnit XML, not the terminal summary line. `pyproject.toml` sets
      # `addopts = "-q"`, so a command-line `-q` makes `-qq` and pytest prints
      # no summary at all — parsing stdout is how a wrong count goes unnoticed.
      - name: Acceptance clauses (plan §2)
        run: |
          set +e
          uv run pytest tests/acceptance -p no:cacheprovider --tb=no \
            --junitxml=acceptance.xml > acceptance.txt 2>&1
          set -e
          tail -40 acceptance.txt

      - name: The reading has not moved
        run: uv run python tests/acceptance/check_reading.py acceptance.xml

  # A moved reading on main or on the daily sweep blocks nothing and is green
  # to the next author, so without this nothing announces it — the same gap
  # that left a router config undeployed for 16 hours
  # (alpha-engine-config-I7169), which is why deploy.yml already carries this
  # job. Mirrored here rather than reinvented.
  #
  # It fires only on the arms that grade the system. A red `test` job on a PR
  # already blocks that PR and is the author's to see.
  notify-main-failure:
    needs: [acceptance]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5363e60b9343e270be9a44d41e85516068b4226e
    secrets: inherit
