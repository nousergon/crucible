name: coverage-badge

# Publishes the measured line-coverage percentage as a shields.io endpoint file
# on the `badges` branch, so README.md renders a number that came from a real
# run.
#
# repository-baseline-policy.md §5.1 forbids a hand-set badge outright: it
# renders identically to a real one, so a reader cannot tell them apart, and it
# becomes false the moment reality moves without anyone editing a file. §5.3
# requires a coverage badge on a Tier A repo, so "no badge" is not an option
# either -- the only compliant answer is a generated one.
#
# In-house on purpose: the alternatives were a gist plus a long-lived PAT, or
# a third-party coverage vendor with access to a repo that is private today.
# Both buy presentation with a permanent cost; this buys it with a branch.
#
# IT NO LONGER MEASURES ANYTHING (alpha-engine-config-I9938). Until 2026-09-07
# this workflow ran its own `uv sync --frozen` and its own full pytest with
# coverage on every push to main -- reproducing, on the identical commit, the
# reading ci.yml's `test` job had just taken with the identical pytest
# invocation. The old comment here even said so out loud: "The number
# published here is the same one ci.yml's coverage floor enforces." It was the
# same number, measured twice, and the second measurement was billed: 62 runs
# at ~4 minutes over the week of 2026-09-01, ~248 metered minutes on a PRIVATE
# repository against a ~50,000/month allowance the fleet is on track to
# exceed. Now ci.yml uploads the percentage it already measured and this
# workflow only formats and publishes it -- one run, no install, no suite,
# seconds instead of minutes.
#
# THE READING CANNOT DIVERGE FROM THE GATE, which is the real gain and not
# just the cheaper one. Two independent measurements of the same thing can
# disagree -- a lockfile resolved differently, a test excluded from one
# invocation and not the other -- and when they do, the badge is a number no
# gate enforces. There is now exactly one measurement, and the badge is a
# rendering of it.
#
# tests/acceptance is excluded from the measured run -- see ci.yml's
# "Foundation tests" step comment for why: those clauses fail by design until
# the phase they gate exits and are not part of the PR-path gate.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: publish coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A CI run that FAILED took no trustworthy reading, so there is nothing to
    # publish and the previous badge stays -- correct, because it still
    # describes the last commit that actually passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Scoped to this job alone. Write access exists here only to push one JSON
    # file to a branch that contains nothing else. `actions: read` is the new
    # grant and is the minimum that reads another workflow run's artifact.
    permissions:
      contents: write
      actions: read
    steps:
      # workflow_dispatch has no triggering run attached, so resolve the most
      # recent CI run that actually succeeded on main and read ITS artifact. A
      # manual re-publish must not become the one path that silently measures
      # something different from the gate.
      - name: Resolve the CI run holding the reading
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RID=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
            if [ -z "$RID" ] || [ "$RID" = "null" ]; then
              echo "::error::no successful CI run on main to read a coverage percentage from -- refusing to publish a badge measured by nothing"
              exit 1
            fi
          else
            RID='${{ github.event.workflow_run.id }}'
          fi
          echo "source CI run: $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        id: fetch
        continue-on-error: true
        with:
          name: coverage-pct
          path: incoming
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Read the percentage CI measured
        id: cov
        run: |
          set -euo pipefail
          if [ "${{ steps.fetch.outcome }}" != "success" ] || [ ! -f incoming/coverage-pct.txt ]; then
            echo "::error::CI run ${{ steps.src.outputs.run_id }} published no coverage-pct artifact. Either its Foundation tests step could not parse a TOTAL line, or the artifact's 1-day retention expired on a re-run of an old commit. Refusing to publish a badge rather than publishing a stale or invented one."
            exit 1
          fi
          PCT=$(tr -dc '0-9' < incoming/coverage-pct.txt)
          if [ -z "$PCT" ]; then
            echo "::error::the coverage-pct artifact held no parseable number -- refusing to publish"
            exit 1
          fi
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage measured by CI run ${{ steps.src.outputs.run_id }}: $PCT%"

      - name: Build the shields endpoint payload
        run: |
          PCT="${{ steps.cov.outputs.pct }}"
          if   [ "$PCT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$PCT" -ge 75 ]; then COLOR=green
          elif [ "$PCT" -ge 60 ]; then COLOR=yellowgreen
          elif [ "$PCT" -ge 40 ]; then COLOR=orange
          else                         COLOR=red
          fi
          mkdir -p out
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > out/coverage.json
          cat out/coverage.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: repo

      - name: Publish to the badges branch
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Orphan branch: it carries badge payloads and nothing else, so it
          # never needs the history of main and can never conflict with it.
          git fetch origin badges --depth=1 2>/dev/null && git checkout badges || git checkout --orphan badges
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp ../out/coverage.json ./coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "coverage unchanged - nothing to publish"
            exit 0
          fi
          git commit -m "chore(badges): coverage ${{ steps.cov.outputs.pct }}%"
          git push origin badges:refs/heads/badges
