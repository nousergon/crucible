name: Dispatch Lockstep

# alpha-engine-config-I9878 finding 2: the cross-repo dispatch-lockstep
# contract between `nousergon/crucible`'s `crucible/components.yaml` and
# `nousergon/nous-ergon-ops`'s `infrastructure/cloudformation/crucible-v2.yaml`
# is guarded by ONE test file
# (`nous-ergon-ops/tests/crossrepo/test_crucible_dispatch_lockstep.py`) that
# used to fire only on `nous-ergon-ops` events. Both repositories can break
# the contract; only one ran the guard. On 2026-09-02 a change HERE (crucible
# PR44, the `board` row) turned `nous-ergon-ops` `main` red, and the delay
# before anyone could see it was bounded by nothing but the next unrelated
# push to that repo — measured at over two hours that day, unbounded in
# general. Worse for diagnosis: it surfaced in the repo that did not change,
# against an author who did not change it.
#
# ── THIS IS DELIBERATELY INTERIM — `push: [main]` ONLY, NO `pull_request` ──
#
# The original design ran this on every `pull_request` too, so the change
# introducing drift would be the change that fails. It does not, because of
# what this job's credential is:
#
# It mints a short-lived GitHub App installation token
# (`nousergon_lib.github_app.installation_token`, narrowed at mint time to
# `permissions={"contents": "read"}`) rather than holding a repo-scoped
# deploy key, so it needs no new long-lived secret
# (`identity-access-policy.md` §4/§7: the fleet's `ne-groomer` App already
# suffices; Brian ruling on `alpha-engine-config-I9967` / `crucible-PR125`).
# But `mint_installation_token`/`installation_token` (nousergon-lib, measured
# 2026-09-06) narrow only PERMISSIONS, not REPOSITORY — there is no
# `repositories` kwarg, and the App is installed org-wide. A token minted
# this way is `contents:read` across every repository the installation
# covers, not just `nous-ergon-ops`. Trusting a `pull_request` subject for
# the OIDC role that reads the App's SSM-held credentials would hand that
# reach to any pull request — exactly the escalation
# `test_crucible_dispatch_lockstep.py`'s own docstring already rules out for
# the sibling case: *"Deliberately NOT the `nousergon_lib.github_app`
# installation-token path `scheduled-identity-check` uses: that job runs
# `if: github.event_name != 'pull_request'` specifically because its OIDC
# trust is pinned to this workflow on `main` and PR code must never reach the
# App's private key."* `iam-drift-check.yml`'s `scheduled-identity-check`
# carries that identical guard for the identical reason.
#
# So this job mirrors `scheduled-identity-check` exactly: `if:
# github.event_name != 'pull_request'`, even though no `pull_request` trigger
# is declared below — belt and suspenders, so the guard survives someone
# later adding one without re-deriving why it can't run there. It runs on
# every push to `main` (crucible's OWN main going red at the merge that
# introduces drift, which was the point of finding 1 too) and on
# `workflow_dispatch` for a manual check. It does NOT run on `pull_request`.
#
# **PR-path coverage is tracked, not abandoned**: `alpha-engine-config-I<see
# PR body>` requests a `repositories` kwarg on the library function so a
# token can be narrowed to exactly `nous-ergon-ops`, at which point this job
# moves onto `pull_request` and becomes the change-that-introduces-drift
# detector finding 2 actually asks for. Until then, this is strictly better
# than before this PR (crucible's own `main` going red at ITS merge) but not
# yet as good as `nous-ergon-ops-PR1000`'s side (a PR-triggered check).
#
# ── the credential ────────────────────────────────────────────────────────
#
# `crucible-v2-github-lockstep` (nous-ergon-ops/infrastructure/cloudformation
# /crucible-v2.yaml, sibling PR): trusted for
# `repo:nousergon/crucible:ref:refs/heads/main` ONLY (no `pull_request`
# subject, ever, per the rationale above), granted exactly
# `ssm:GetParameter` on the three `/alpha-engine/groom/github_app_*`
# parameters — the same three `BoardRole` already reads
# (`ReadTheGroomerAppCredentialsToMintATrackerToken`,
# `alpha-engine-config-I9967`), for the identical reason: no second
# long-lived credential when the fleet's App already suffices. That role is
# created by an OPERATOR-GATED stack apply, not by merging the ops PR
# (`pull-request-policy` §4.2 form 3) — until the apply happens this job
# fails on the identity-confirmation step below, naming the exact command.
#
# No `paths:` filter: this job is a token mint, a shallow checkout and a
# two-file pytest run, seconds against the §4.11 CI budget, and a required
# check gated by a path filter can stay pending forever on a skip.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  LOCKSTEP_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/crucible-v2-github-lockstep

jobs:
  crucible-dispatch-lockstep:
    name: crucible-dispatch-lockstep
    # Mirrored byte-for-byte from iam-drift-check.yml's scheduled-identity-check
    # (nous-ergon-ops) — see the header comment above for why. No pull_request
    # trigger is declared, so this is defence in depth against one being added
    # later without re-deriving the reason it can't run there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variable AWS_ACCOUNT_ID is set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::repository variable AWS_ACCOUNT_ID is not set — set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/crucible --body '<12-digit-account-id>'"
            exit 1
          fi
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ env.LOCKSTEP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The identity actually obtained, read back from AWS rather than
      # restated from `env` — same argument board.yml makes. Names the exact
      # operator command if the role does not exist yet, because the stack
      # apply that creates it is operator-gated (pull-request-policy §4.2
      # form 3), not automated by this merge.
      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${LOCKSTEP_ROLE_ARN##*/}"
          case "${assumed}" in
            *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;;
            *)
              echo "::error::this job assumed ${assumed}, not ${expected}. If the role does not exist yet, the crucible-v2 stack has not been applied since the sibling nous-ergon-ops PR (crucible-v2-github-lockstep) merged. That apply is OPERATOR-GATED as a security boundary, not automated: run AWS_PROFILE=ne-admin aws cloudformation deploy --stack-name crucible-v2 --template-file infrastructure/cloudformation/crucible-v2.yaml --capabilities CAPABILITY_NAMED_IAM --region us-east-1 --tags system=crucible-v2 from a nous-ergon-ops checkout on main, then re-run this workflow."
              exit 1
              ;;
          esac

      - name: Install App-token and test dependencies
        run: python3 -m pip install --quiet "nousergon-lib[github-app]" pytest pyyaml

      # Narrowed to `contents: read` at mint time — GitHub only permits
      # NARROWING an App installation token below what the installation
      # holds, never widening it. No `repositories` narrowing exists yet in
      # this library function (see the header comment); the OIDC trust above
      # is what keeps this token off the pull_request path until it does.
      - name: Mint a read-only ne-groomer token
        id: token
        run: |
          set -euo pipefail
          TOKEN="$(python3 -c "
          from nousergon_lib.github_app import installation_token
          print(installation_token(permissions={'contents': 'read'}), end='')
          ")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Checkout nous-ergon-ops (private) at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nousergon/nous-ergon-ops
          token: ${{ steps.token.outputs.token }}
          path: nous-ergon-ops-checkout
          persist-credentials: false

      # CRUCIBLE_ROOT is THIS repository's own checkout, not a second clone of
      # `crucible`: the whole point is that the change introducing drift is
      # the change that fails, once this job also covers the pull_request
      # path (tracked, see the header comment).
      - name: Lockstep guard
        env:
          CRUCIBLE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd nous-ergon-ops-checkout
          python3 -m pytest tests/crossrepo/test_crucible_dispatch_lockstep.py -q
