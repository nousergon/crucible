name: Dispatch Lockstep

# alpha-engine-config-I9878 finding 2: the cross-repo dispatch-lockstep
# contract between `nousergon/crucible`'s `crucible/components.yaml` and
# `nousergon/nous-ergon-ops`'s `infrastructure/cloudformation/crucible-v2.yaml`
# is guarded by ONE test file
# (`nous-ergon-ops/tests/crossrepo/test_crucible_dispatch_lockstep.py`) that
# used to fire only on `nous-ergon-ops` events. Both repositories can break
# the contract; only one ran the guard. On 2026-09-02 a change HERE (crucible
# PR44, the `board` row) turned `nous-ergon-ops` `main` red, and the delay
# before anyone could see it was bounded by nothing but the next unrelated
# push to that repo — measured at over two hours that day, unbounded in
# general. Worse for diagnosis: it surfaced in the repo that did not change,
# against an author who did not change it.
#
# crucible-PR126 closed finding 2 for the `push: main` path only (the change
# introducing drift fails at ITS OWN merge, in this repo). This file
# (alpha-engine-config-I10119, re-examined after alpha-engine-config-I10117 /
# nousergon-lib-PR388 landed) adds the PR path finding 2 actually asked for:
# the change introducing drift fails BEFORE merge, on the PR itself.
#
# ── why the obvious `pull_request` job was unsafe, and what changed ────────
#
# The naive shape — run the existing job on `pull_request` too — was unsafe
# because of what the job's credential is, not because of the token's scope.
# The job mints a short-lived GitHub App installation token
# (`nousergon_lib.github_app.installation_token`) by reading the App's
# SSM-held private key. A `pull_request` job executes the PR's OWN workflow
# file and checks out the PR's OWN code, so PR-supplied code would run WITH
# that OIDC trust in scope and could mint an unnarrowed token itself — the
# token's scope at mint time is irrelevant if PR code can ask for a wider one.
# `nousergon-lib-PR388`'s `repositories` kwarg narrows what gets minted; it
# does not change who is allowed to ask, so narrowing it alone does not make a
# `pull_request` job safe. `test_crucible_dispatch_lockstep.py`'s own
# docstring rule — "PR code must never reach the App's private key" — is
# about the key, not the token.
#
# The safe shape is `pull_request_target`, which runs the workflow
# DEFINITION on main (this file, as committed to crucible's own main) and
# checks out the BASE ref by default — so PR code is never fetched, never
# executed, and never in a position to ask for anything. The one thing this
# job needs from the PR is data: `crucible/components.yaml`'s content at the
# PR's head sha, fetched over the read-only Contents API and parsed as YAML
# by the ops repo's TRUSTED test module — never executed. See
# `crucible-dispatch-lockstep-pr` below;
# `tests/test_workflow_triggers.py::test_the_lockstep_pr_job_checks_out_no_pr_head_and_executes_no_pr_supplied_code`
# is the structural guard that a later edit cannot quietly undo this.
#
# The original `crucible-dispatch-lockstep` job (push to `main` +
# `workflow_dispatch`) is UNCHANGED in what it does and stays as a backstop:
# it is what catches drift introduced any way other than through this PR
# path (an admin merge that bypasses review, a direct push if branch
# protection is ever relaxed). Its `if:` now excludes BOTH `pull_request` and
# `pull_request_target` — the original excluded only `pull_request`, which
# would not have stopped this file's own `on:` block gaining
# `pull_request_target` from also firing that job a second time on every PR.
#
# ── the credential ────────────────────────────────────────────────────────
#
# Both jobs assume the lockstep identity (nous-ergon-ops/
# infrastructure/cloudformation/crucible-v2.yaml, sibling PR). Its trust now
# carries exactly two subjects: the immutable-id `ref:refs/heads/main` subject
# (unchanged — what crucible's push events actually present, measured
# 2026-09-01) and the NAME-based `pull_request` subject
# (`repo:nousergon/crucible:pull_request` — the subject GitHub issues for
# BOTH `pull_request` and `pull_request_target` events). The name-based
# `ref:refs/heads/main` subject that used to sit alongside the immutable one
# is dropped to keep the role at exactly two trusted subjects rather than
# growing to four as the PR path is added — it was never the subject
# crucible's push events actually present (see
# `CrucibleImmutableSubjectPrefix`'s own description), so dropping it is not
# a live-behaviour change, only a narrower role now that it is reachable from
# PR-triggered CI. See the sibling nous-ergon-ops PR for the CFN comment and
# the test asserting this exact two-subject shape.
#
# Both jobs are granted exactly `ssm:GetParameter` on the three
# `/alpha-engine/groom/github_app_*` parameters — the same three `BoardRole`
# already reads (`ReadTheGroomerAppCredentialsToMintALockstepToken`,
# `alpha-engine-config-I9967`), for the identical reason: no second
# long-lived credential when the fleet's App already suffices. The role's
# trust update is applied by an OPERATOR-GATED stack apply, not by merging
# the ops PR (`pull-request-policy` §4.2 form 3) — until the apply happens
# both jobs fail on the identity-confirmation step below, naming the exact
# command.
#
# The PR-path job's minted token is additionally narrowed with `repositories:
# ["nous-ergon-ops"]` (the `nousergon-lib-PR388` kwarg) — `contents: read` on
# exactly `nous-ergon-ops`, not every repository the App installation covers.
#
# No `paths:` filter on either job: this is a token mint, a shallow checkout
# and a two-file pytest run, seconds against the §4.11 CI budget, and a
# required check gated by a path filter can stay pending forever on a skip.

on:
  push:
    branches: [main]
  # `pull_request_target:` STAYS, and the reasoning is worth stating because
  # the instinct on a public repo is to delete it (this trigger was deleted
  # on 2026-09-07 and reinstated the same hour, alpha-engine-config-I10156).
  #
  # The footgun is not the trigger. It is `pull_request_target` COMBINED with
  # a checkout of the PR head — `with: ref: github.event.pull_request.head.sha`
  # — which runs fork-authored code with base-repo permissions and secrets in
  # scope. `crucible-dispatch-lockstep-pr` below does the opposite and says so
  # at its checkout step: no `with.repository`, no `with.ref`, so it checks out
  # this repo's own base ref, and the one piece of PR-supplied content it
  # reads is fetched as DATA over the read-only Contents API and decoded to a
  # file that nothing executes. That is the documented-safe shape.
  #
  # Deleting the trigger does NOT leave that job harmlessly guarded: its
  # `if: github.event_name == 'pull_request_target'` can then never be true,
  # so the job silently never runs and the PR-path half of the lockstep drift
  # guard — the half that catches contract drift BEFORE merge — is gone while
  # still appearing in the file. A required check that cannot fire is worse
  # than the risk it was deleted to avoid.
  #
  # The safety argument is ENFORCED, not just written down:
  # `tests/test_workflow_triggers.py::test_the_pull_request_target_job_never_checks_out_pr_code`
  # fails if this job's checkout ever gains a `ref:` or `repository:` override.
  pull_request_target:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  LOCKSTEP_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.CRUCIBLE_ROLE_PREFIX }}-lockstep

jobs:
  crucible-dispatch-lockstep:
    name: crucible-dispatch-lockstep
    # Excludes BOTH pull_request and pull_request_target: this job's
    # checkout has no repository/ref override, so on pull_request_target it
    # would otherwise check out the base ref and run the PUSH job's own
    # steps a second, redundant time on every PR. The PR path is
    # `crucible-dispatch-lockstep-pr` below, which is deliberately a
    # DIFFERENT job rather than a branch of this one's `if:`, so this job's
    # own safety argument (mirrors iam-drift-check.yml's
    # scheduled-identity-check) never has to be re-derived alongside the PR
    # job's different one.
    if: ${{ !contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variable AWS_ACCOUNT_ID is set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::repository variable AWS_ACCOUNT_ID is not set — set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/crucible --body '<12-digit-account-id>'"
            exit 1
          fi
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # This repo is public and its run logs are public; GitHub masks
      # SECRETS, not repository VARIABLES. The identity assertion below
      # prints an assumed-role ARN that embeds the account id — mask it
      # before the credential step runs so nothing downstream can leak it.
      # The assertion still works with masking on: it compares only the
      # role-name segment (`*":assumed-role/${expected}/"*`), which the mask
      # does not touch.
      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ env.LOCKSTEP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The identity actually obtained, read back from AWS rather than
      # restated from `env` — same argument board.yml makes. Names the exact
      # operator command if the role does not exist yet, because the stack
      # apply that creates it is operator-gated (pull-request-policy §4.2
      # form 3), not automated by this merge.
      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${LOCKSTEP_ROLE_ARN##*/}"
          case "${assumed}" in
            *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;;
            *)
              echo "::error::this job assumed ${assumed}, not ${expected}. If the role does not exist yet, the crucible-v2 stack has not been applied since the sibling nous-ergon-ops PR (the lockstep identity) merged. That apply is OPERATOR-GATED as a security boundary, not automated: run AWS_PROFILE=ne-admin aws cloudformation deploy --stack-name crucible-v2 --template-file infrastructure/cloudformation/crucible-v2.yaml --capabilities CAPABILITY_NAMED_IAM --region us-east-1 --tags system=crucible-v2 from a nous-ergon-ops checkout on main, then re-run this workflow."
              exit 1
              ;;
          esac

      - name: Install App-token and test dependencies
        run: python3 -m pip install --quiet "nousergon-lib[github-app]" pytest pyyaml

      - name: Mint a read-only ne-groomer token
        id: token
        run: |
          set -euo pipefail
          TOKEN="$(python3 -c "
          from nousergon_lib.github_app import installation_token
          print(installation_token(permissions={'contents': 'read'}), end='')
          ")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Checkout nous-ergon-ops (private) at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nousergon/nous-ergon-ops
          token: ${{ steps.token.outputs.token }}
          path: nous-ergon-ops-checkout
          persist-credentials: false

      # CRUCIBLE_ROOT is THIS repository's own checkout, not a second clone of
      # `crucible`.
      - name: Lockstep guard
        env:
          CRUCIBLE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd nous-ergon-ops-checkout
          python3 -m pytest tests/crossrepo/test_crucible_dispatch_lockstep.py -q

  crucible-dispatch-lockstep-pr:
    name: crucible-dispatch-lockstep-pr
    # The complement of the job above: runs ONLY on pull_request_target, so
    # the two jobs never both fire (nor both skip) for the same event.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # read-only GITHUB_TOKEN: this repo's own Contents API only
      id-token: write  # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variable AWS_ACCOUNT_ID is set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::repository variable AWS_ACCOUNT_ID is not set — set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/crucible --body '<12-digit-account-id>'"
            exit 1
          fi
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      # No `with.repository` and no `with.ref`: on `pull_request_target` this
      # checks out the BASE ref (crucible's own main), which is what
      # `pull_request_target` runs the workflow definition against in the
      # first place. PR code is never fetched by this step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The one piece of PR-supplied content this job reads, fetched as DATA
      # over the read-only Contents API — never via actions/checkout of the
      # PR head, never executed. The base64 payload is decoded straight to a
      # file; nothing pipes it into a shell or interpreter.
      - name: Fetch the PR's components.yaml as data
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/nousergon/crucible/contents/crucible/components.yaml?ref=${HEAD_SHA}" --jq '.content' | base64 -d > crucible/components.yaml

      # The SECOND piece, and the reason it exists: the guard compares
      # `components.yaml` against the workflows that declare an `on.schedule`
      # cron, and until 2026-09-10 it read the PR's components.yaml against
      # the BASE ref's workflows. So a PR whose whole content is a workflow
      # fix could never turn this check green — measured on
      # `crucible-PR198`, which removed the very cron the guard was
      # complaining about and still failed, naming the removed cron. A
      # required check that a correct fix cannot satisfy teaches people to
      # merge past it (`alpha-engine-config-I10467`).
      #
      # Same documented-safe shape as the step above and no wider: DATA over
      # the read-only Contents API at the PR head, base64-decoded straight to
      # files, nothing executed and nothing piped into a shell. This job's
      # own workflow definition was already loaded by
      # `pull_request_target` before any of this runs, so replacing files
      # under `.github/workflows/` in the workspace changes what the TEST
      # reads and cannot change what runs.
      #
      # Deletions are mirrored too. A PR that DELETES a cron workflow is the
      # other half of the same blindness: leaving the base copy in place
      # would keep the guard failing over a file the PR removed.
      - name: Mirror the PR's .github/workflows as data
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/nousergon/crucible/contents/.github/workflows?ref=${HEAD_SHA}" \
            --jq '.[] | select(.type == "file") | .name' > /tmp/pr-workflows.txt
          # Refuse an empty listing rather than mirroring nothing: an API
          # hiccup that returned zero files would silently delete every
          # workflow from the workspace and leave the guard grading an empty
          # set, which reads GREEN. A guard that passes over no data is the
          # failure this whole file exists to prevent.
          if [ ! -s /tmp/pr-workflows.txt ]; then
            echo "::error::the PR head lists no files under .github/workflows — refusing to mirror an empty set"
            exit 1
          fi
          while IFS= read -r name; do
            gh api "repos/nousergon/crucible/contents/.github/workflows/${name}?ref=${HEAD_SHA}" \
              --jq '.content' | base64 -d > ".github/workflows/${name}"
          done < /tmp/pr-workflows.txt
          for existing in .github/workflows/*; do
            base="$(basename "${existing}")"
            grep -qxF "${base}" /tmp/pr-workflows.txt || rm -f "${existing}"
          done

      # This repo is public and its run logs are public; GitHub masks
      # SECRETS, not repository VARIABLES. The identity assertion below
      # prints an assumed-role ARN that embeds the account id — mask it
      # before the credential step runs so nothing downstream can leak it.
      # The assertion still works with masking on: it compares only the
      # role-name segment (`*":assumed-role/${expected}/"*`), which the mask
      # does not touch.
      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ env.LOCKSTEP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${LOCKSTEP_ROLE_ARN##*/}"
          case "${assumed}" in
            *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;;
            *)
              echo "::error::this job assumed ${assumed}, not ${expected}. If the role does not exist yet, the crucible-v2 stack has not been applied since the sibling nous-ergon-ops PR (the lockstep identity, PR-path trust) merged. That apply is OPERATOR-GATED as a security boundary, not automated: run AWS_PROFILE=ne-admin aws cloudformation deploy --stack-name crucible-v2 --template-file infrastructure/cloudformation/crucible-v2.yaml --capabilities CAPABILITY_NAMED_IAM --region us-east-1 --tags system=crucible-v2 from a nous-ergon-ops checkout on main, then re-run this workflow."
              exit 1
              ;;
          esac

      - name: Install App-token and test dependencies
        run: python3 -m pip install --quiet "nousergon-lib[github-app]" pytest pyyaml

      # Narrowed to `contents: read` on exactly `nous-ergon-ops`
      # (`repositories=["nous-ergon-ops"]`, nousergon-lib-PR388 /
      # alpha-engine-config-I10117): unlike the push job's token, this one is
      # reachable from a `pull_request_target` trust and must never be able
      # to read any OTHER repository the App installation covers.
      - name: Mint a read-only ne-groomer token narrowed to nous-ergon-ops
        id: token
        run: |
          set -euo pipefail
          TOKEN="$(python3 -c "
          from nousergon_lib.github_app import installation_token
          print(installation_token(permissions={'contents': 'read'}, repositories=['nous-ergon-ops']), end='')
          ")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Checkout nous-ergon-ops (private) at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nousergon/nous-ergon-ops
          token: ${{ steps.token.outputs.token }}
          path: nous-ergon-ops-checkout
          persist-credentials: false

      # CRUCIBLE_ROOT is the self-checkout above, with the PR's
      # components.yaml overlaid onto it. Everything else in that tree
      # (crucible's own .github/workflows/, used by the `dispatch_workflow`
      # half of the guard) is main's, unmodified by the PR — the guard grades
      # the one file this job actually needs to grade as the PR's diff, and
      # nothing else is trusted from the PR.
      - name: Lockstep guard against the PR's components.yaml
        env:
          CRUCIBLE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd nous-ergon-ops-checkout
          python3 -m pytest tests/crossrepo/test_crucible_dispatch_lockstep.py -q
