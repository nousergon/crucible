name: Adversarial Review Gate

# Plan §11 risk 1: "every track's exit is reviewed by an independent
# adversarial agent against §2's acceptance tests, not by its author." This
# workflow is the structural enforcement of that clause — not a convention,
# not a PR-body checkbox.
#
# The practice is VINDICATED and this file does not weaken it: on 2026-09-02,
# 5 of 8 crucible PRs failed independent adversarial review round one and 3
# failed round two, and every defect found was real. The gate was broken; the
# review was not.
#
# ── What changed, and why (alpha-engine-config-I9873, I9794) ──────────────
#
# 1. THE REQUIRED CONTEXT IS A REAL JOB NOW. A GitHub repository-ruleset
#    required status check is NOT satisfied by a check-run created through
#    `POST /check-runs`. Measured 2026-09-02 by removal: dropping
#    `adversarial-review-gate` from `required_status_checks` and changing
#    nothing else merged the PR instantly; restoring it re-blocked — on a head
#    whose check-run read `completed/success`, `app=github-actions(15368)`,
#    under both `filter=all` and `filter=latest`. The check that DOES satisfy
#    the rule (`lint + foundation tests`) is emitted by a real job; the one
#    that did not was POSTed by a job through the REST API, and that is the
#    only structural difference between them. So the `post-pending-check` job,
#    its `POST /check-runs`, its collision guard and the `resolve` job's
#    self-heal are all DELETED: every one of them existed to manage an
#    API-created check-run that cannot satisfy the rule. The job below is
#    named for the context and GitHub emits its check-run itself.
#
#    Ruled out first, each by experiment, so nobody re-runs them:
#    `require_extra_approval_for_unattributed_changes` (off at repo AND org
#    level) · stale rule evaluation after a ruleset edit · a corrupted GET→PUT
#    ruleset round-trip (diffed byte-identical) · a missing `integration_id`
#    (set to 15368) · duplicate or lingering check-runs · a pending review or
#    unresolved thread · deleting and recreating the ruleset · `--admin`
#    (a ruleset with empty `bypass_actors` refuses admins; there is no
#    `enforce_admins` equivalent). `gh pr merge` never names the offending
#    rule — `gh api -X PUT /repos/{o}/{r}/pulls/{n}/merge` does. Go there
#    first if anything blocks.
#
# 2. THE GATE MEASURES, IT NO LONGER ASKS. `reviewer` and `author` used to be
#    free-text `workflow_dispatch` inputs supplied by the very session asking
#    to be passed. A gate whose input is supplied by the thing it grades
#    measures nothing. The `author` input is GONE: the author set is DERIVED
#    from the commits under review (their `Claude-Session:` trailers plus the
#    commit author/committer identities GitHub records), and `reviewer` is
#    constrained to that same namespace — a Claude session id — so the
#    comparison is between like things. `.github/scripts/adversarial_review.py`
#    owns both, has its own self-tests in `tests/`, and is the single
#    implementation both jobs call.
#
# 3. THE VERDICT IS A DURABLE RECORD, NOT A CHECK-RUN. `record-verdict` writes
#    a commit status on the reviewed head sha under the context
#    `adversarial-review/<reviewer session id>` — the reviewer is IN the
#    context, so nothing has to parse an identity out of 140 characters of
#    prose. Statuses are per-sha and append-only, so a review can never be
#    read as applying to a commit it did not see, and re-review history is
#    retrievable from `GET /commits/{sha}/statuses`.
#
#    I9873 names a store artifact under the v2 prefix as the preferred home
#    and a commit status as the third option. The store is taken for the
#    PHASE-exit reading (`crucible.gate._clause_independently_reviewed`,
#    keys from `crucible.keys.review_key`) and NOT for this PR-time check,
#    for a measured reason: every GitHub OIDC role for this repository
#    (`crucible-v2-github-deploy`, `crucible-v2-github-board`) pins its trust
#    condition to `ref:refs/heads/main`, so a `pull_request` job — running on
#    `refs/pull/N/merge` — cannot assume ANY role and cannot reach the store
#    at all; and no existing role may write `crucible/reviews/*` in the first
#    place. Both are IAM facts in a repository this change may not touch.
#    `alpha-engine-config-I9880` carries the review-writer role and the
#    `record-verdict` step that will file the store artifact alongside the
#    status; until it lands the phase clause reads UNMET and names the prefix,
#    which is the honest state of the measurement rather than a reason to
#    relax anything.
#
# Cost: the gate job runs on every pull_request open/sync/reopen/
# ready-for-review event — a checkout, two `gh api` reads and one stdlib
# Python call, no `uv sync` (~15s on ubuntu-latest). `record-verdict` is
# workflow_dispatch-only, once per review round. This repo is PRIVATE and CI
# minutes are metered (crucible AGENTS.md "Visibility"); at this cost ~100 PR
# events/month is a couple of minutes against the §4.11 budget.
#
# What this workflow does NOT do: it does not run the acceptance suite and it
# grades no code. The adversarial review — reading the diff, running
# `uv run pytest tests/acceptance`, checking the change against plan §2 —
# happens in the reviewing session. This workflow records that session's
# verdict and enforces who may record it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number the adversarial review was run against'
        required: true
      reviewer:
        description: 'The REVIEWING session id (session_<alnum>), not a GitHub login — every agent in this fleet dispatches as the same collaborator account, so a login can never prove independence. There is deliberately no `author` input: the author set is derived from the commits.'
        required: true
      conclusion:
        description: 'Review verdict'
        required: true
        type: choice
        options: [success, failure]
      summary:
        description: 'One-line verdict summary (e.g. "no findings against plan §2" or "3 findings, see review comment")'
        required: true

permissions: {}

# `pull_request` runs are keyed on the HEAD SHA, so only a genuine re-run of
# the exact same sha can cancel one — two different-sha runs for one PR never
# cancel each other. A `record-verdict` dispatch gets its own group and is
# never cancelled: `cancel-in-progress` is an expression, not a flat `true`,
# because a durable verdict write should queue behind another verdict write
# rather than be discarded mid-flight.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' &&
    format('record-{0}', inputs.pr_number) ||
    format('pr-{0}', github.event.pull_request.head.sha) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  adversarial-review-gate:
    # The job `name:` IS the check-run name, and this one is the required
    # status check context. Do not rename it without editing the
    # `main-protection` ruleset in the same change — a required context naming
    # a job that no longer exists is a check that never reports, which blocks
    # every PR forever with no red anywhere to explain why.
    name: adversarial-review-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: An independent session recorded a passing review of this head sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The commits under review. This is where the AUTHOR side of the
          # independence comparison comes from — derived, never supplied.
          gh api --paginate "/repos/$REPO/pulls/$PR_NUM/commits" > commits.json

          # `/status` is the COMBINED status: the latest state per context,
          # which is what "has this been reviewed" means. The full history is
          # at /statuses and is the audit trail, not the reading.
          gh api "/repos/$REPO/commits/$SHA/status" --jq '.statuses' > statuses.json

          python3 .github/scripts/adversarial_review.py gate \
            --commits commits.json \
            --statuses statuses.json \
            --dispatch-hint "gh workflow run 'Adversarial Review Gate' --repo $REPO -f pr_number=$PR_NUM -f reviewer=<the reviewing session id> -f conclusion=success -f summary='<one line>'"

  record-verdict:
    name: record an adversarial review verdict
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      # Re-runs the PR's gate run so the required check re-reads the verdict
      # it just recorded. Without this the operator would have to re-run a job
      # by hand after every review, and an operator step an agent could have
      # run itself is a defect, not a request.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Refuse a self-review, then record the verdict on the head sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ inputs.pr_number }}
          REVIEWER: ${{ inputs.reviewer }}
          CONCLUSION: ${{ inputs.conclusion }}
          SUMMARY: ${{ inputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          sha="$(gh api "/repos/$REPO/pulls/$PR_NUM" --jq '.head.sha')"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::PR #$PR_NUM not found or has no head sha."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_ENV"

          gh api --paginate "/repos/$REPO/pulls/$PR_NUM/commits" > commits.json

          # The independence control. `context` validates the reviewer id's
          # form AND proves it is not one of the identities derived from the
          # commits, and exits non-zero otherwise — so a self-review never
          # reaches the status API at all.
          context="$(python3 .github/scripts/adversarial_review.py context --commits commits.json --reviewer "$REVIEWER")"
          echo "Recording $CONCLUSION under context '$context' on $sha"

          # A status `description` is capped at 140 characters and a longer
          # one is a 422, which would lose the verdict entirely over a verbose
          # summary. Truncated loudly rather than silently: the full text is
          # in this run's log, which `target_url` points at.
          description="$(printf '%s' "$SUMMARY" | cut -c1-140)"

          gh api "/repos/$REPO/statuses/$sha" \
            -X POST \
            -f state="$CONCLUSION" \
            -f context="$context" \
            -f description="$description" \
            -f target_url="$RUN_URL"

      - name: Re-run this PR's gate so the required check reads the new verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          run_id="$(gh api "/repos/$REPO/actions/workflows/adversarial-review-gate.yml/runs?event=pull_request&head_sha=$sha" --jq '[.workflow_runs[]] | max_by(.id).id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No pull_request run of this workflow exists for $sha, so there is no check-run to refresh. The verdict IS recorded (the commit status above) and a push or a manual re-run of the gate will read it."
            exit 1
          fi

          # A run still in flight was very likely started BEFORE the status
          # above was posted, so it would read the old state and finish red.
          # Wait for it to settle rather than racing it — bounded, and loud on
          # timeout: a silent give-up here leaves a green verdict behind a red
          # check with nothing saying why.
          for _ in $(seq 1 40); do
            state="$(gh api "/repos/$REPO/actions/runs/$run_id" --jq '.status')"
            if [ "$state" = "completed" ]; then
              break
            fi
            echo "gate run $run_id is $state; waiting"
            sleep 15
          done
          if [ "$state" != "completed" ]; then
            echo "::error::gate run $run_id did not settle within 10 minutes. The verdict is recorded; re-run that run once it finishes."
            exit 1
          fi

          gh api "/repos/$REPO/actions/runs/$run_id/rerun" -X POST
          echo "Re-ran gate run $run_id; it will now read the recorded verdict for $sha."
