name: Adversarial Review Gate

# Plan §11 risk 1: "every track's exit is reviewed by an independent
# adversarial agent against §2's acceptance tests, not by its author." This
# workflow is the structural enforcement of that clause — not a convention,
# not a PR-body checkbox.
#
# Ported from alpha-engine-config/.github/workflows/adversarial-review-gate.yml
# and adapted: that reference posts only a PENDING check, relying on an
# external async groom sweep (this repo has none) to resolve it, and its
# check-run POST is 403-inert until the ne-groomer GitHub App gets
# checks:write. This version is self-contained and functional from the first
# run: the workflow's own GITHUB_TOKEN is granted `checks: write` directly
# (no App dependency), and a second job — invoked by hand or by a separate
# Claude session running the adversarial pass — RESOLVES the same check to
# success/failure. Independence is enforced structurally: `resolve` takes
# `reviewer` and `author` as explicit workflow_dispatch inputs — session/agent
# identifiers, not GitHub logins — and refuses to complete the check if they
# are the same identity. This repo has exactly one GitHub collaborator and it
# has authored every PR ever opened here, so comparing `github.actor` to the
# PR's `.user.login` (the original design) is equal on every dispatch and can
# never be satisfied; recording the reviewer as data, supplied by the
# dispatching session rather than inferred from the dispatching account, is
# the only comparison that can actually distinguish an independent review
# from a self-review in this fleet. See the adversarial review on this PR
# (finding 2) for the full argument.
#
# Cost: `post-pending-check` runs on every pull_request open/sync/reopen/
# ready-for-review event — one `gh api` call, no checkout, no `uv sync`, no
# runner minutes beyond the job's own startup (~5-10s on ubuntu-latest).
# `resolve` is workflow_dispatch-only, invoked once per track exit, same
# shape (~5-10s). This repo is PRIVATE and CI minutes are metered
# (crucible AGENTS.md "Visibility"); at this cost, ~100 PR events/month is
# well under a minute of billed compute.
#
# What this workflow does NOT do: it does not run the acceptance suite
# itself and does not grade anything. The adversarial review — reading the
# diff, running `uv run pytest tests/acceptance`, checking the change against
# plan §2 — happens in the reviewing session; this workflow only records the
# verdict as a structural, non-bypassable gate and enforces who may record
# it. See the PR body for the follow-up `crucible/gate.py` wiring so a
# phase's exit gate (`crucible gate`) can read this verdict as a clause,
# consistent with gate.py's "a gate reads; it never runs" design.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number the adversarial review was run against'
        required: true
      reviewer:
        description: 'Session/agent identifier of the reviewing session (NOT a GitHub login — every agent in this fleet dispatches as the same collaborator account, so a login can never prove independence)'
        required: true
      author:
        description: 'Session/agent identifier of the authoring session, recorded independently of GitHub identity, per the same reason as reviewer'
        required: true
      conclusion:
        description: 'Review verdict'
        required: true
        type: choice
        options: [success, failure]
      summary:
        description: 'One-line verdict summary (e.g. "no findings against plan §2" or "3 findings, see review comment")'
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  post-pending-check:
    if: github.event_name == 'pull_request'
    # No `name:` here on purpose — the job's DISPLAYED check-run name must
    # not collide with the gate's own check-run name ("adversarial-review-
    # gate", posted below via the API). A collision means two check-runs
    # share that name on every head sha, and the job's own always-green run
    # satisfies "adversarial-review-gate" in required-checks without any
    # review having happened. Measured on 129a34b — see the adversarial
    # review on this PR, finding 1. Left unset, the check-run defaults to
    # the job id, "post-pending-check".
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Post pending adversarial-review-gate check-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #$PR_NUM is a draft — no adversarial-review-gate check posted until it is ready for review."
            exit 0
          fi

          echo "Posting pending adversarial-review-gate check-run for PR #$PR_NUM @ $SHA"

          # `output` is a nested OBJECT in the check-runs API, not a string —
          # `-f output='{"title":...}'` sends the literal string and 422s
          # ("not an object or null"), measured 2026-09-02 on this exact
          # workflow. `-f output[title]=... -f output[summary]=...` is gh
          # api's field-path syntax for building the nested object.
          gh api "/repos/$REPO/check-runs" \
            -X POST \
            -f name="adversarial-review-gate" \
            -f head_sha="$SHA" \
            -f status="in_progress" \
            -f output[title]="Adversarial review gate: pending" \
            -f output[summary]="Waiting on an independent adversarial review against plan section 2 acceptance tests (plan section 11 risk 1). Resolved by the 'resolve' job in this workflow (workflow_dispatch), run by a reviewer who is not this PR's author."

  resolve:
    if: github.event_name == 'workflow_dispatch'
    name: resolve adversarial-review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Look up the pending check-run and refuse a same-identity review
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ inputs.pr_number }}
          REVIEWER: ${{ inputs.reviewer }}
          AUTHOR: ${{ inputs.author }}
        run: |
          set -euo pipefail

          # Independence is recorded as DATA, never inferred from the
          # dispatching GitHub account. This repo has exactly one
          # collaborator identity and it has authored every PR ever opened
          # here (measured on the adversarial review of this PR, finding
          # 2) — so `github.actor` vs `.user.login` is equal on every
          # dispatch and the check could never be completed. `reviewer`
          # and `author` are session/agent identifiers supplied explicitly
          # by the dispatching session; independence is exactly that they
          # differ. The PR's actual GitHub author login is fetched below
          # only for the audit trail in the check-run summary, never for
          # the refusal decision.
          reviewer_lc="$(printf '%s' "$REVIEWER" | tr '[:upper:]' '[:lower:]')"
          author_lc="$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"

          if [ -z "$reviewer_lc" ] || [ -z "$author_lc" ]; then
            echo "::error::Both 'reviewer' and 'author' inputs are required session/agent identifiers (not GitHub logins)."
            exit 1
          fi

          if [ "$reviewer_lc" = "$author_lc" ]; then
            echo "::error::reviewer ('$REVIEWER') and author ('$AUTHOR') are the same identity. An adversarial review must be independent of the author (plan §11 risk 1) — dispatch this from a different reviewing session."
            exit 1
          fi

          gh_author="$(gh api "/repos/$REPO/pulls/$PR_NUM" -q '.user.login')"
          sha="$(gh api "/repos/$REPO/pulls/$PR_NUM" -q '.head.sha')"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::PR #$PR_NUM not found or has no head sha."
            exit 1
          fi

          # Complete the SAME check-run post-pending-check created rather
          # than posting a second one — a second POST left the original
          # 'in_progress' run pending forever (finding 4 on this PR's
          # review). Look it up by name ("adversarial-review-gate", the
          # gate's check identity — see the no-`name:` note on the
          # post-pending-check job above) and status on the head sha.
          run_id="$(gh api "/repos/$REPO/commits/$sha/check-runs" -q '[.check_runs[] | select(.name=="adversarial-review-gate" and .status=="in_progress")][0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No in_progress 'adversarial-review-gate' check-run found on $sha — nothing to resolve. Has post-pending-check run for this PR (it is skipped while the PR is a draft)?"
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "gh_author=$gh_author" >> "$GITHUB_OUTPUT"

      - name: Complete the pending adversarial-review-gate check-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.pr.outputs.run_id }}
          GH_AUTHOR: ${{ steps.pr.outputs.gh_author }}
          REVIEWER: ${{ inputs.reviewer }}
          AUTHOR: ${{ inputs.author }}
          CONCLUSION: ${{ inputs.conclusion }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail

          title="Adversarial review: ${CONCLUSION}"
          full_summary="$(printf '%s\n\nReviewed by: %s (independent of author: %s) — PR opened by GitHub account: %s' "$SUMMARY" "$REVIEWER" "$AUTHOR" "$GH_AUTHOR")"

          # PATCH the existing pending run — see the note above finding
          # this run_id. `output` is a nested object, built via gh api's
          # `-f output[key]=value` field-path syntax, not a literal JSON
          # string (same gotcha as post-pending-check's POST).
          gh api "/repos/$REPO/check-runs/$RUN_ID" \
            -X PATCH \
            -f status="completed" \
            -f conclusion="$CONCLUSION" \
            -f output[title]="$title" \
            -f output[summary]="$full_summary"

          echo "Recorded adversarial-review-gate=$CONCLUSION on check-run $RUN_ID (reviewer: $REVIEWER, author: $AUTHOR, GitHub author: $GH_AUTHOR)"
