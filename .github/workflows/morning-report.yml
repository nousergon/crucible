name: Morning report

# The 6am PT accountability delivery — `alpha-engine-config-I9896`.
#
# Brian stated on 2026-09-02 that a daily 6am PT report existed. It did not:
# the three claude.ai cloud routines were disabled (the groom since
# 2026-06-23), and the only Crucible v2 schedule was `board.yml`, which
# renders the board into the store every day and hands it to nobody. An
# accountability surface that exists only as a belief is worse than one that
# is missing — it is trusted while emitting nothing (principle 7).
#
# ── Why a SEPARATE workflow rather than a second job in board.yml ─────────
#
# A workflow carries ONE schedule set, and this job's cadence is not the
# board's: the board renders at 21:30 UTC (after the close plus the
# registry's 6h window) and this reads that render at 10:00 UTC the next
# morning — 12.5h later, so the report always reads a render from that
# night's close, never a stale one. Putting both in one file means both jobs
# fire at both times unless each is gated on `github.event.schedule` — a
# string comparison against a cron literal, which fails open the moment
# either cron is edited and reads green while doing so. It would also make
# `components.yaml`'s `dispatch_workflow` name a workflow whose declared
# cadence is not this row's, which is the exact blindness that field exists
# to remove (`alpha-engine-config-I9878`).
#
# `crucible/AGENTS.md` says "deploy.yml is the only other workflow this repo
# will ever have". That sentence is already stale — `board.yml` and
# `adversarial-review-record.yml` both exist and both post-date it
# (`alpha-engine-config-I9887` owns the correction) — so it is not a
# constraint on this file.
#
# ── The cron declares 03:00 PT, not 06:00 PT (alpha-engine-config-I9966) ──
#
# Corrected 2026-09-06. The cron was `0 13 * * *` (06:00 PDT / 05:00 PST) on
# the belief that a declared cron fires at its declared instant. It does
# not: every scheduled GitHub Actions workflow on this account fires 3-5h
# after its cron, MEASURED and chronic, not a bad day
# (`alpha-engine-config-I9966`; the four-workflow table lives on
# `components.yaml`'s `report.morning.deadline` comment). A `0 13` cron was
# therefore DELIVERING near 09:07 PT, three hours later than the accountability
# report this workflow exists to provide.
#
# `crucible.morning.DELIVERY_CRON_UTC` is the one declared constant for the
# cron below, and `tests/test_morning.py`'s workflow-shape test parses this
# file's `on.schedule` cron and asserts it equals that constant — so this
# literal and the code cannot silently disagree. It is set three hours
# earlier than a naive 06:00 PT literal, `0 10 * * *`, specifically so the
# DELIVERED message lands near the intended 06:00 PT once the account's
# measured 3-5h delivery lag is added back. The declared cron is now an
# input to delivery time, not a statement of it.
#
# ── UTC, and what it drifts to in November ────────────────────────────────
#
# GitHub Actions crons are UTC and have no timezone. `0 10 * * *` is
# **03:00 PDT** today and becomes **02:00 PST** on 2026-11-01, when the US
# leaves daylight time. That drift is DECLARED rather than discovered: the
# message itself prints the local time it was delivered at
# (`crucible.morning.DELIVERY_TZ`), and `tests/test_morning.py` asserts this
# exact cron resolves to 03:00 PDT and 02:00 PST, so the November change is a
# committed fact a reader can look up rather than a surprise.
#
# The rejected alternative was two crons (`0 10` and `0 11`) with a job-level
# `if: github.event.schedule == '...'` picking the right one per season. That
# is a partial parser over a cron literal deciding whether the day's report
# goes out at all, and `tests/test_workflow_triggers.py` records five rounds
# of adversarial review on why a predicate of that shape is a denylist of the
# syntax someone thought of. One cron that lands an hour early for four
# months is a smaller defect than a guard that can silently deliver twice or
# not at all.
#
# ── Why notify-failure IS here, and what would remove it ─────────────────
#
# The design argument for omitting it is that this job's failures are already
# pages on the declared path: a delivery that raises leaves `status: failed`
# in `runs/report.morning/{day}/{firing}/run.json` and `alerts.sweep`'s
# FAILURE condition pages on it; a job that dies before the manifest exists
# (a failed OIDC assume, a cancelled runner) leaves it absent and the ABSENCE
# condition pages at the registry deadline. That argument rests on a premise
# that is FALSE TODAY.
#
# MEASURED 2026-09-03, `alpha-engine-config-I9905`: `alerts.sweep` has NEVER
# written a manifest. Its dispatcher fails `RunInstances` on every invocation
# since the stack existed, so both declared page conditions are DARK -- a
# component emitting nothing is unobserved, not healthy, and that includes
# the thing whose job is to notice silence. A 06:00 failure would therefore
# reach nobody at all, which is precisely the state this workflow exists to
# end: Brian trusting a surface that emits nothing.
#
# So this carries `board.yml`'s notify block, as a STOPGAP with a stated
# removal condition rather than a permanent second channel. The double-page
# concern is real and is the accepted cost: while the sweep is dark there is
# no page to double.
#
# REMOVE THIS JOB WHEN: `crucible/runs/alerts.sweep/` holds `status: ok`
# manifests on five consecutive scheduled firings, i.e. the declared page
# path is demonstrably alive. Until then, deleting it re-creates the silence.
# The fix for the sweep itself is `nous-ergon-ops-PR1007`.
#
# ── What the identity may do ──────────────────────────────────────────────
#
# The morning-report identity (nous-ergon-ops/infrastructure/
# cloudformation/crucible-v2.yaml) reads `crucible/board/*` and
# `crucible/runs/board/*` and writes exactly `crucible/runs/report.morning/*`
# — its own manifest and the message it delivered, and nothing else. It is
# NOT BoardRole: a reporting surface that could write the board would be able
# to author the reading it reports.
#
# That role is created by an OPERATOR-GATED apply, not by merging the ops PR
# (`pull-request-policy` §4.2 form 3 — the merge emits the exact command AND a
# detector stays red until it runs). The same apply is already pending for
# `alpha-engine-config-I9881`, so this adds no operator step that was not
# already outstanding. Until it happens this workflow fails daily on the
# identity check below, naming the exact command. That is the detector
# working.
#
# ── Delivery needs no AWS credential ──────────────────────────────────────
#
# Telegram only, `severity=info`, notifying (not silent — I9916), SNS off — the same shape
# `nousergon-lib/.github/workflows/notify-ci-failure.yml` runs fleet-wide.
# `ALPHA_ENGINE_SECRETS_SOURCE=env` forces `krepis.secrets` to resolve the
# bot token and chat id from the environment rather than reaching SSM, which
# this role is not granted and does not need.

# ── Why the trigger STAYS a GitHub cron (alpha-engine-config-I9960) ───────
#
# The alternative considered and rejected: move `report.morning` onto the
# crucible-v2 EventBridge schedule group beside the dispatcher's four
# existing schedules, which do not silently drop events. Three measured
# reasons it is the wrong trade TODAY, and the one measurement that reverses
# it.
#
# 1. IT DOES NOT REMOVE THE CLASS. EventBridge delivers reliably; the
#    dispatcher it delivers TO does not. Measured 2026-09-03: every
#    dispatcher invocation since the stack existed failed `RunInstances` --
#    9 of 9 scheduled v2 jobs launched nothing, and NOTHING PAGED. Swapping
#    triggers changes which mechanism can silently not fire. Only a detector
#    on the DELIVERED ARTIFACT removes it, and that detector
#    (`crucible.alerts.evaluate_absence`, this row's `deadline` in
#    `components.yaml`) is required under either choice and sufficient under
#    both.
#
# 2. IT COSTS THE IDENTITY SEPARATION. The dispatcher launches ONE launch
#    template with ONE instance profile, `RuntimeRole`, which writes
#    `crucible/board/*`. The morning-report identity exists precisely
#    so the reporting surface cannot author the reading it reports (see "What
#    the identity may do" above, and `crucible/morning.py`'s own docstring).
#    Trading a stated invariant for a latency property is the wrong direction.
#
# 3. EVIDENCE FAVOURS NEITHER YET. GitHub's scheduler on this repository: one
#    scheduled firing on record (`board.yml`, 113 minutes late, succeeded),
#    one occurrence that did not fire. The dispatcher: one successful
#    scheduled run on record, 2026-09-04, after a repair. Neither is proven,
#    and the cheaper, more separated option is the one to keep while the
#    detector generates the evidence.
#
# WHAT REVERSES THIS, mechanically and with no new surface: two ABSENCE
# incidents for `report.morning` inside `CEILING_WINDOW_TRADING_DAYS`
# BREACHES the declared two-a-month page ceiling, which `crucible/alerts.py`
# says "is a defect in this module, never a reason to add a suppression".
# A ceiling breach whose members are all this row disqualifies GitHub cron on
# measurement, and the job moves to EventBridge behind its OWN instance
# profile -- the separation in (2) is a requirement of that move, not a
# casualty of it.
on:
  schedule:
    # 03:00 PDT / 02:00 PST — `crucible.morning.DELIVERY_CRON_UTC`. See the
    # DST section above and I9966 recalibration section above that.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions: {}

# Serialised, and a superseded run is NOT cancelled. A cancelled run here is
# a morning with no report and no failed manifest — an ABSENCE page for a
# scheduling artefact.
concurrency:
  group: morning-report
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # AWS_ACCOUNT_ID and STORE_URI come from repository variables
  # (alpha-engine-config-I9906) — this repo goes PUBLIC at phase-1 exit
  # (I9775) and `AGENTS.md` forbids infrastructure identifiers, bucket names
  # and account numbers in the tree. The role name is built from
  # `vars.CRUCIBLE_ROLE_PREFIX` below, same as the account id: this is a
  # public repo, its run logs are public, and GitHub does not mask
  # repository variables — only the `::add-mask::` step ahead of the
  # credential step keeps the account id out of a printed ARN.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  REPORT_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.CRUCIBLE_ROLE_PREFIX }}-morning-report
  STORE_URI: ${{ vars.CRUCIBLE_STORE_URI }}
  # ── the topic names the alerting layer refuses to guess ────────────────
  # `crucible.alerts._required_name` raises unless these are set. They are
  # repository VARIABLES for the same reason `AWS_ACCOUNT_ID` is: this repo
  # went public on 2026-09-07 and `AGENTS.md` forbids infrastructure
  # identifiers in the tree, so the scrub (alpha-engine-config-I10156) removed
  # the literals and made the names required env.
  #
  # Nothing then declared them to a workflow. `Board` failed
  # 2026-09-07T23:37Z and `Gate close` failed 2026-09-08T00:56Z, both on
  # `RuntimeError: CRUCIBLE_MUTED_TOPIC is unset`, raised from
  # `_clause_old_alerts_muted` while it formatted its own UNMET detail — a
  # branch no CI job reaches, because CI does not grade the live store. So the
  # v2 board and the phase-exit filer were both dark from the moment the repo
  # went public, on the two days phase 0 and phase 1 turned MET.
  CRUCIBLE_MUTED_TOPIC: ${{ vars.CRUCIBLE_MUTED_TOPIC }}
  CRUCIBLE_PAGES_TOPIC: ${{ vars.CRUCIBLE_PAGES_TOPIC }}
  # alpha-engine-config-I10123. The full update is now posted as a comment on
  # the rolling `[v2 board] daily update` issue in the private
  # alpha-engine-config repository, and an Actions token cannot reach a
  # different, private repository at all. Same grant, same mechanism as
  # `board.yml`'s statement of this name: the fleet's existing `ne-groomer`
  # GitHub App, installed org-wide with Issues: write, mints a short-lived
  # installation token from three SSM parameters MorningReportRole reads
  # (`ReadTheGroomerAppCredentialsToMintATrackerToken`, nous-ergon-ops
  # crucible-v2.yaml). A repository VARIABLE, like STORE_URI above: it names
  # where the credentials are, never what they are.
  CRUCIBLE_TRACKER_APP_SSM_PREFIX: ${{ vars.CRUCIBLE_TRACKER_APP_SSM_PREFIX }}

jobs:
  report:
    name: deliver the board's reading
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variables are set
        run: |
          missing=0
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::repository variable AWS_ACCOUNT_ID is not set — set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/crucible --body '<12-digit-account-id>'"
            missing=1
          fi
          if [ -z "$STORE_URI" ]; then
            echo "::error::repository variable CRUCIBLE_STORE_URI is not set — set it with: gh variable set CRUCIBLE_STORE_URI --repo nousergon/crucible --body '<s3-uri-of-the-crucible-v2-store>'"
            missing=1
          fi
          # alpha-engine-config-I10123. A WARNING, not an error: this repo's
          # `Repository variables are set` steps fail the JOB, and a hard
          # failure here would page ABSENCE for a scheduling artefact over a
          # credential gap that `crucible report.morning` itself already
          # reports as a named, loud `TrackerError` — the same reasoning
          # `board.yml`'s own warning for this variable states.
          if [ -z "$CRUCIBLE_TRACKER_APP_SSM_PREFIX" ]; then
            echo "::warning::repository variable CRUCIBLE_TRACKER_APP_SSM_PREFIX is not set, so posting the full update to the private tracker will fail and report.morning will fail loudly with no Telegram message sent — set it to the fleet GitHub App's SSM credential prefix (gh variable set CRUCIBLE_TRACKER_APP_SSM_PREFIX --repo nousergon/crucible --body '<prefix>') and apply the crucible-v2 stack so MorningReportRole may read {prefix}github_app_id, _installation_id and _private_key"
          fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen

      # This repo is public and its run logs are public; GitHub masks
      # SECRETS, not repository VARIABLES. The identity assertion below
      # prints an assumed-role ARN that embeds the account id — mask it
      # before the credential step runs so nothing downstream can leak it.
      # The assertion still works with masking on: it compares only the
      # role-name segment (`*":assumed-role/${expected}/"*`), which the mask
      # does not touch.
      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ env.REPORT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The identity actually obtained, read back from AWS rather than
      # restated from `env`. Same argument board.yml and deploy.yml make:
      # what is falsifiable is the identity, not the literal.
      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${REPORT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}. The morning report must run as an identity that cannot write the board it reports. If the role does not exist yet the crucible-v2 stack has not been applied since the ops PR adding it merged. That apply is OPERATOR-GATED as a security boundary, not automated: run AWS_PROFILE=ne-admin aws cloudformation deploy --stack-name crucible-v2 --template-file infrastructure/cloudformation/crucible-v2.yaml --capabilities CAPABILITY_NAMED_IAM --region us-east-1 --tags system=crucible-v2 from a nous-ergon-ops checkout on main, then re-run this workflow. This job staying red until that happens is the detector, per pull-request-policy 4.2 form 3."; exit 1 ;; esac

      - name: Read the board and deliver it
        env:
          # Forces `krepis.secrets` to resolve from the environment instead of
          # reaching SSM, which this role is deliberately not granted.
          ALPHA_ENGINE_SECRETS_SOURCE: env
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The fleet console's base URL (alpha-engine-config-I9926): a
          # repository variable, like the store URI above, because a hostname
          # is an infrastructure identifier this tree carries none of. Unset
          # means the report links the presigned page instead, and says so.
          CRUCIBLE_CONSOLE_URL: ${{ vars.CRUCIBLE_CONSOLE_URL }}
        # `--run-mode live`: a scheduled firing is a live run, and
        # `run_manifest.v2` requires the field with no default (there is no
        # date this could be inferred from — see `crucible.runmode`).
        run: uv run crucible report.morning --run-mode live --store "$STORE_URI"

  # The stopgap. See "Why notify-failure IS here" above for the measured
  # reason and the condition that retires it.
  notify-failure:
    needs: [report]
    if: ${{ failure() }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@619de3f32aef2e63329e7270afb87ec6b1e381e3
    secrets: inherit
