[project]
name = "crucible"
version = "0.1.0"
description = "The experiment harness: one command, one manifest, one verdict."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
dependencies = [
    # First-party, PINNED not floored (fleet §139): the arena engine, the
    # arena_cycle contract and MetricRecord are consumed here, never
    # re-implemented (crucible_v2_rebuild_plan §4.4).
    #
    # 0.124.118 is the ANTICIPATED next version once `nousergon-lib` PR402
    # (`ArenaConfig` gains `promote_min_weeks`, alpha-engine-config-I9763,
    # -I10504) merges and auto-bumps from the current main HEAD (0.124.117).
    # `uv.lock` in this diff is UNCHANGED and does not yet resolve this pin —
    # `uv lock` cannot resolve a version not yet published to PyPI. Whoever
    # finalizes this PR must run `uv lock` here once PR402 publishes, confirm
    # the actual published version matches (or correct this literal if
    # another PR landed in between), and only then merge. `uv sync --frozen`
    # is expected to fail loudly until that happens — that is the intended
    # signal, not a regression.
    "nousergon-lib[github-app]==0.124.118",
    # Trading calendar, dual-date resolution, structured logging, alerts.
    #
    # `[openai]` is NOT optional here (alpha-engine-config-I10473). krepis
    # declares the client as an extra -- `openai>=1.40; extra == "openai"`,
    # imported at `krepis/llm.py`'s `from openai import OpenAI` -- and this
    # pin carried none, so no v2 box could make a call in the `openai` wire
    # format at all. Measured 2026-09-10 on i-0fcd1c9649a27aa62, release
    # ab8ed65: `fault.probe --fault-capability-class chaos_probe` failed with
    # `ModuleNotFoundError: No module named 'openai'`, the fourth precondition
    # in series to be found this way after the registry path (-I10346), the
    # loopback route (-I10356) and the 4xx upstream (-I10367).
    #
    # The extra belongs on the DEPENDENCY, not on crucible's own extras: this
    # repo addresses a capability class and must never know which wire format
    # the router picks for it (principle 8). A second wire format joins this
    # same pin rather than becoming a crucible-level choice.
    "krepis[openai]==0.59.58",
    # Run-manifest schema validation. The schema is the enforcement surface
    # for `status in {ok, failed}` (plan §4.2), so validation is a runtime
    # dependency, not a test-only one.
    "jsonschema>=4.26.0",
    # Every document this repo READS is parsed into a validated model, never
    # into dict indexing over `json.loads` output. The difference is where a
    # malformed document surfaces: as a named field error at the boundary, or
    # as a KeyError traceback three functions in — which is what the acceptance
    # ratchet did until an adversarial review hit it (2026-09-02).
    #
    # JSON Schema stays the CROSS-REPO contract surface (`schemas/*.json`,
    # plan §4.2): those are consumed by other repos and must not require a
    # Python import to read. Pydantic is the in-process reader, not a
    # replacement for them.
    "pydantic>=2.9",
    "PyYAML>=6.0.3",
    # The M slot's linear estimators and the CPCV grader operate on a
    # (trading_day x name) panel. Pure-Python normal equations over ~450k
    # rows is ~20s per fold and 15 folds per cycle, so the arithmetic is
    # vectorised rather than hand-rolled (principle 4).
    #
    # The feature layer (plan §10.4) is a materialized parquet artifact and
    # the U/R grading path is columnar arithmetic over a price panel, so
    # pandas and pyarrow join numpy here. Core, not optional: a build that
    # cannot read `features/{version}/{day}.parquet` cannot run a cycle at
    # all, and an optional dependency every job needs is a lie about the
    # install surface. The floor is track B's (>=2.1), not the looser one —
    # two floors for one package is a lockfile waiting to disagree with a
    # fresh resolve.
    "numpy>=2.5.3",
    "pandas>=2.0",
    "pyarrow>=25.0.1",
    # The convex layer for `crucible.portfolio`'s mean-variance program
    # (`alpha-engine-config-I10500`). The engine composes the objective and the
    # constraint geometry; cvxpy owns the DCP analysis and dispatch to a conic
    # solver, and ships CLARABEL as that solver. Writing a projected-gradient
    # solver here instead would be a second-rate interior-point method this
    # repository then maintains, against a second-order cone constraint and an
    # x^{1.5} impact term it would have to linearise (principle 4, principle 6).
    #
    # Floored within a minor series rather than pinned: the DCP atoms used here
    # (norm, quad_form, psd_wrap, power, abs) are the stable core of the API,
    # and the solver behind them is addressed through cvxpy's own installed-
    # solver list rather than imported directly (principle 8) — the engine
    # names CLARABEL, falls back through SCS and OSQP, and records which one
    # answered.
    #
    # Ledoit-Wolf shrinkage is NOT reached through scikit-learn: it is
    # `nousergon_lib.quant.factor_risk.ledoit_wolf_cov`, pure numpy and already
    # pinned above, so the institutional default estimator costs this repository
    # no compiled dependency at all.
    "cvxpy>=1.9.2,<1.10",
    # The store's S3 backend and the conditional PUT the release pointer
    # flips on. Floored, not pinned: boto3 ships daily and the API surface
    # used here (put_object/head_object/get_paginator, IfMatch/IfNoneMatch)
    # is stable, so a pin would be a weekly Dependabot PR buying nothing.
    "boto3>=1.43.89",
]

[project.optional-dependencies]
# ArcticDB is the PRODUCTION price source and nothing else. It is a large
# compiled wheel, and CI grades this repo against synthetic and fixture
# panels through the same `PriceSource` adapter the live source implements
# (principle 8), so a CI job that installed it would pay minutes for a code
# path it never exercises. `crucible data.daily --source arctic` states the
# missing extra by name when it is absent — it never falls back to a
# different source, which would silently change what the run measured.
arcticdb = ["nousergon-lib[arcticdb]==0.124.118"]

[project.scripts]
crucible = "crucible.cli:main"

[project.urls]
Homepage = "https://github.com/nousergon/crucible"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--ignore=tests/integration`: the third test tier (`alpha-engine-config-
# I10419`) runs against a REAL dedicated S3 prefix and a REAL dedicated
# ArcticDB library, nightly and before a phase gate — deliberately never
# per-PR (see tests/integration/README.md). ci.yml and deploy.yml both run
# `pytest ... --ignore=tests/acceptance` with no path argument, so without
# this default every existing invocation in both workflows — neither of
# which this change may edit — would collect and execute tests/integration
# too, against credentials that do not exist in that context.
# .github/workflows/integration-nightly.yml is this tier's own execution
# path; it names `tests/integration` as an explicit test path, which
# overrides no ignore this addopts sets (pytest merges ignores, it does not
# let a positional path defeat one).
addopts = "-q --ignore=tests/integration"

[tool.coverage.run]
# repository-baseline-policy.md §4.2 C1: the denominator is the whole source
# tree, not the files a test happened to import. `source` makes coverage.py
# report modules the foundation suite never loaded; `omit` stays empty so the
# scope cannot be narrowed into a flattering number.
source = ["crucible"]
omit = []

[tool.coverage.report]
# §4.2 C3: a ratchet set at the measured value (93%, tests/ --ignore=tests/acceptance,
# 2026-09-03). Raise it when coverage improves; lowering it is a policy
# amendment, never a way to make a change pass. tests/acceptance is excluded
# from the measured run because those clauses fail by design until the phase
# they gate exits (see ci.yml) and are not part of the PR-path gate.
fail_under = 93
show_missing = true
# NO line exclusions. Three rounds of independent adversarial review
# (2026-09-05, crucible-PR112) showed that every regex-shaped exclusion —
# the coverage pragma, then an anchored `if TYPE_CHECKING:`, then the same
# with a rebinding guard — can be made to exclude EXECUTING code by an
# author (trailing comment; `TYPE_CHECKING = True`; `globals()[...]`;
# `typing.TYPE_CHECKING = True` in a conftest). A regex over source text
# cannot know whether a block runs. So the denominator is every statement
# in `crucible/`, the ~20 `if TYPE_CHECKING:` / `__main__` lines simply
# count as missed, and the floor below is measured against that.
# `tests/test_no_suppressions.py` pins this list EMPTY and the two coverage
# tables closed.
exclude_lines = []
