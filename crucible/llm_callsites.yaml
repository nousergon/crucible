# LLM_CALLSITE_REGISTRY — every v2 LLM call site, by id.
#
# Normative source: plan §4.8. Every call site the crucible package can reach
# a model through has a row here, and `tests/test_llm_callsites.py` proves the
# coverage by ENUMERATING call sites out of the AST — not by reading this file
# and trusting it. A registry checked against itself measures nothing.
#
# EMPTY IS THE CORRECT STATE TODAY, and it is a measured one rather than an
# unwritten one: phase 1 carries zero LLM arms (the LLM research arms enter in
# phase 5), and `crucible.llm.audit_call_sites` walks the package on every CI
# run and fails the moment a call site exists without a row. An empty registry
# beside a passing enumerator is evidence of no call sites; an empty registry
# beside no enumerator would be evidence of nothing.
#
# Each row:
#   purpose            what this call site asks a model for, in one sentence.
#   capability_class   the router GROUP or capability class asked for —
#                      never a provider model id, a base url or an SDK client
#                      (principle 8). `crucible.llm.call` refuses anything
#                      that looks like a vendor model id.
#   max_usd_per_call   this site's own ceiling, under the per-run cap.
#   owner              the module that holds the call.
schema_version: llm_callsite_registry.v1

# The ALLOWLIST of capability classes `crucible.llm.call` will ask for, and
# the only names a `callsites:` row may declare.
#
# It used to be a nine-entry substring DENYLIST inside `llm.py` — `gpt-`,
# `claude-`, `gemini-`, `llama`, `mistral`, `glm-`, `deepseek`, `o3`, `o4` —
# and `grok-`, `qwen`, `command-r`, `nova-` and `kimi` all walked through it,
# as did a bare base url and a bare provider name. Principle 8 is not "refuse
# the vendors somebody thought of"; it is that a call site addresses a
# capability, which is a membership question with a positive answer. A
# denylist is wrong by default and wrong again with every new vendor.
#
# `crucible.llm` unions this list with `krepis.router.TIER_GROUPS` — the
# router's own tier-to-group mapping — so the router's groups are askable
# without being restated here, and a group removed there stops being askable.
# This list is for classes THIS deployment's router serves beyond the bare
# tiers. Adding a name is a deliberate edit in the file where the reason for
# every name is written down; it is not something a call site can do to
# itself.
# EMPTY IS THE CORRECT STATE, same reasoning as `callsites: {}` below.
#
# This list used to carry `reasoning_high` — a string that read as a router
# group and never was one: the registry declares exactly `low`, `med`,
# `high`, `ultra`, and `reasoning_high` mapped to nothing until
# `crucible.llm.CAPABILITY_CLASS_GROUPS` refused it with
# `CapabilityClassNotRouted`. Brian's ruling on `alpha-engine-config-I9970`
# (2026-09-08, option (a)) settled which real groups the phase-5 call sites
# address: the LLM research arms ask for `high`, the phase-5 judge asks for
# `ultra`. Both are already router TIER GROUPS (`krepis.router.TIER_GROUPS`),
# so both are askable by IDENTITY through the union in
# `crucible.llm._capability_classes` with no row here — this list exists
# only for a class whose name is NOT already a group name, and there is none
# today.
#
# ONE NAME NOW CARRIES A REASON (`alpha-engine-config-I10343`):
#
#   chaos_probe
#     A FAULT-INJECTION TARGET, and the reason it is listed is that it must
#     never be reachable by a production arm. It is a real model group in the
#     fleet's private model registry whose contract is "never serves": every
#     member routes to a real, already-configured upstream host with a model
#     string that host will never answer, so a call always fails at the
#     provider rather than at the router edge. Plan §10.7 fault 3 ("the LLM
#     router returns 500") is not inducible against the real scheduled path
#     without it — and it was not inducible WITH it either, because the group
#     was declared on the registry side of the boundary while
#     `crucible.llm._require_capability_class` refused the name here, so no
#     crucible call site could ask for it (`alpha-engine-config-I10343`, the
#     same "seam with no reachable consumer" shape as -I10156, -I10317 and
#     -I10327).
#     It is NOT a tier group, so listing it here is the only way to make it
#     askable at all — which is the property that makes this a deliberate
#     edit rather than something a call site could arrange for itself. What
#     stops it becoming reachable by accident, in both directions:
#       * a `chaos_probe` member may not join any other group's fallback
#         chain, and no ordinary model may join this group — enforced
#         structurally, per group, on every registry PR
#         (`alpha-engine-config/scripts/validate_llm_model_registry.py`
#         invariant 21, a blocking error);
#       * an arm recipe whose `llm_callsite` names a call site declaring a
#         fault-injection class is REFUSED at parse time
#         (`crucible.slots.arms`), so no U/R arm can select it;
#       * the per-run override that redirects an ordinary call site to it
#         admits nothing else, and is recorded on the manifest
#         (`crucible.llm.parse_fault_capability_class`,
#         `fault_capability_class`).
#     `crucible.llm.FAULT_INJECTION_CAPABILITY_CLASSES` is the machine-
#     checkable half of this paragraph; `tests/test_chaos_probe_containment.py`
#     holds the two lists equal and every refusal above firing.
capability_classes:
  - chaos_probe

# NO LONGER EMPTY, and the one row is not an LLM arm.
#
# `faults.router_probe` exists to be broken. It is the call site
# `crucible.fault_probe` reaches the router through so that plan §10.7 fault
# 3 can be induced against the real dispatched path — a job that reaches a
# model, fails on the transport, writes `status: failed` with the cause, and
# pages exactly once. Its `capability_class` is the fault-injection group
# itself, so this row cannot address a serving model even by accident: there
# is no invocation of it that spends money at a real provider, and its
# ceiling is nominal for that reason (a call that never completes is never
# billed; the field's schema forbids 0).
#
# It is deliberately NOT registered in the fleet-wide
# `alpha-engine-config` `LLM_CALLSITE_REGISTRY.yaml`: that register's row
# shape is about provider linkage, prompt-cache buckets and model pinning —
# every field of which is a statement about a call that serves. Filing a
# never-serving probe there would put a fabricated cache floor and a
# fabricated provider beside real rows. Recorded as a deliberate omission
# rather than an oversight; if a phase-5 call site lands here, THAT one needs
# its fleet row.
callsites:
  faults.router_probe:
    purpose: >-
      Reach the router once through the declared door so a transport failure
      can be induced on the real dispatched path (plan §10.7 fault 3); it asks
      for a group contracted never to serve, so it always fails.
    capability_class: chaos_probe
    max_usd_per_call: 0.01
    owner: crucible.fault_probe
