# METRON_CONSUMER_REGISTER — every artifact component 4 (Metron) reads, and
# what produces it. `alpha-engine-config-I10739` deliverable 1; graded by
# `crucible.gate`'s phase-4 clause
# `metron_read_artifacts_have_surviving_producer` (deliverable 3).
#
# WHY IT EXISTS. Phase 4 disables the three v1 Step Functions. Measured
# 2026-09-14 and re-swept 2026-09-17: every Metron-read artifact but the two
# intraday files was produced only inside those pipelines. Disabling them
# without a successor freezes the product's prices, technicals and rating
# track record at the last run while every freshness row goes red — a
# component-2 decommission silently breaking component 4, which is the exact
# failure `architecture.d/146` rule 2 was ruled to prevent.
#
# WHAT IT IS NOT. It is a DECLARATION, not a derivation. This package cannot
# enumerate another repository's readers, and a register checked against
# itself measures nothing (`llm_callsites.yaml` says the same about its own).
# Three things keep it honest instead:
#   * every row cites the Metron `path:line` the read happens at;
#   * `metron_commit` pins what those citations were resolved against, so a
#     stale register is visible rather than merely wrong;
#   * `inventory_doc` points at the private-docs inventory carrying the
#     analysis. Only what the gate READS lives here.
#
# NO BUCKET NAMES, NO STATE MACHINE NAMES, NO ARNs. This repository is
# public at phase-1 exit and forbids infrastructure identifiers (`AGENTS.md`,
# "Visibility"). `schedule_owner` is therefore a SYMBOL — and the symbol is
# also the more durable fact, since a state machine gets renamed and "the v1
# orchestration stack" does not. The values are declared in
# `crucible.models.ScheduleOwnerLiteral`, each with the reason it exists.
#
# ADDING A ROW. A new Metron read defaults to `phase4_disposition:
# unresolved`, which reads UNMET. An artifact nobody has decided about must
# grade as undecided; the alternative is that forgetting to think about one
# is indistinguishable from it being fine.
#
# RETIRING A FEATURE IS BRIAN'S CALL (`architecture.d/146` rule 4), so
# `retired_by_ruling` may not be written without a `ruling` naming it — the
# model refuses the row otherwise. No agent clears this gate by deciding a
# product feature is expendable.

