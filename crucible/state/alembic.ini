# crucible-state migrations (alpha-engine-config-I12510, plan S-22).
#
# No sqlalchemy.url here, ever. The connection string comes from
# CRUCIBLE_STATE_DSN only (migrations/env.py), so this file can never point a
# migration at a database by accident. Offline rendering needs no DSN:
#
#   alembic -c crucible/state/alembic.ini upgrade head --sql
#
# Online (staging branch first, plan S-22 acceptance; needs S-10's DSN):
#
#   CRUCIBLE_STATE_DSN=postgresql+psycopg://... alembic -c crucible/state/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
