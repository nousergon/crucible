# The observability registry (plan §9.2).
#
# One row per CLI job. Registry coverage is DERIVED from this file against
# crucible/cli.py's job table, in both directions — never hand-listed, because
# a hand-written list of things to check is written from the jobs someone
# remembered. tests/test_components_registry.py is that derivation.
#
# A component with no row here is unobserved, not healthy. Its absence cannot
# page (§4.6 reads `deadline` from this file), its logs have no declared
# location or retention, and the console has no surface to render it on.
#
# Five signal classes per row, always all five (§9.2). A class the job
# legitimately does not emit is `null` — declared, not omitted, because an
# omitted class is indistinguishable from a forgotten one.
#
# `dispatch` says WHO starts a scheduled row: `arc` (a stage of the weekly
# driver, `crucible weekly`), `scheduler` (its own EventBridge schedule) or
# `github-actions` (a cron in this repository's own .github/workflows/).
# On-demand rows declare `null`. It is a separate field from `schedule`
# because `schedule` is prose and this is wiring: six rows read
# "weekly, Saturday" while exactly one of them was dispatched by anything.
#
# Each value is verified against the thing it names, in BOTH directions, by
# nous-ergon-ops/tests/crossrepo/test_crucible_dispatch_lockstep.py:
# `scheduler` against the AWS::Scheduler::Schedule set in crucible-v2.yaml,
# `github-actions` against the `on.schedule.cron` workflows in this repo. A
# value checked in one direction only would let a row name a starter that
# does not exist — which is exactly what `board` did between
# 2026-09-02T21:47Z and alpha-engine-config-I9878.
#
# A `github-actions` row also carries `dispatch_workflow`: the basename of
# the workflow that crons it. The link has to be something the workflow
# DECLARES. The first version of that guard matched `crucible <job>` in each
# step's `run:` body, and an adversarial review defeated it by commenting the
# command out - the board rendered nothing and the guard read green. See
# tests/test_workflow_triggers.py for the general result, from five rounds
# against a different guard: any predicate over a `run:` body is a partial
# shell parser, and a partial shell parser is a denylist of the syntax
# someone thought of, which rule 4 forbids.
#
# `log_location` is `<scheme>:<locator>`, and the value is DERIVED from the
# row's own `dispatch` rather than written by hand
# (`crucible.models.derived_log_location`, alpha-engine-config-I10971). It had
# one grammar for four different realities and 20 of these 33 rows named a
# CloudWatch group that does not exist in the account - most of them
# unsatisfiable by construction, not merely unfilled:
#
#   dispatch: scheduler       -> cloudwatch:/crucible/<job>
#       the group the box shell creates at runtime (`log_group = "/crucible/"
#       + job`), for the job it was DISPATCHED as.
#   dispatch: arc             -> cloudwatch:/crucible/weekly
#       the arc dispatches as the single job `weekly` and re-enters
#       `crucible.cli.main` in-process for each stage, so every stage's output
#       lands in the arc's group. No code path can create `/crucible/<stage>`.
#   dispatch: github-actions  -> github-actions:<dispatch_workflow>
#       a workflow's logs live in its Actions run. There is no path by which
#       they reach CloudWatch, so naming a log group for one was a place an
#       operator could be sent to and find nothing.
#   dispatch: null            -> the scheme it would use WHEN dispatched, with
#       no claim the location exists yet. A row dispatched to a box logs to
#       `/crucible/<job>` and nothing else, because that is what the box shell
#       derives; a row a workflow runs names the workflow.
#
# `ComponentsDocument._every_row_declares_the_log_location_its_dispatch_produces`
# refuses any other value, so this cannot drift back.
#
# `deadline` is expressed relative to the TRADING calendar (§4.12): "present
# by T after the close of trading day d". A Monday holiday therefore raises no
# page, without anyone muting anything.
#
# `log_retention_days` is CALENDAR days — one of §4.12's exhaustive
# exceptions, because retention is an AWS property billed by calendar time.
# Manifests are `forever` (retain-archives preference).

version: 1

defaults:
  # §4.6: exactly two page conditions, and this is the only channel either
  # reaches. Everything else is a row on a page nobody is paged to.
  page_channel: telegram:crucible-pages
  quiet_channel: none

components:
  data.daily:
    description: Compile one trading day of market and fundamental data.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs,outputs,rows_in,rows_out,rows_rejected
      outcome: run.json:metrics[data_freshness_trading_days]
    log_location: cloudwatch:/crucible/data.daily
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekdays after close
    dispatch: scheduler
    deadline:
      anchor: close_plus
      cadence: daily
      offset_hours: 3

  data.weekly:
    description: Weekly data refresh and coverage pass.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs,outputs,rows_in,rows_out,rows_rejected
      outcome: run.json:metrics[universe_coverage_ratio]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "09:00"

  data.heal:
    description: Repair a named gap in the store, idempotently.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:rows_in,rows_out,rows_rejected
      # A heal produces no graded outcome; it repairs an input. Declared null
      # rather than omitted.
      outcome: null
    log_location: cloudwatch:/crucible/data.heal
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  holdout:
    description: >-
      Read the sealed holdout's seal state, or unseal it under a named human
      ruling (alpha-engine-config-I10502, plan 9.4). The read form writes
      nothing; only --unseal writes, and it writes the audit record naming the
      ruling.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[holdout/unseal/{trading_day}/{ruling}.json]
      # An unseal releases data; it grades nothing. Declared null rather than
      # omitted, same as data.heal's outcome.
      outcome: null
    log_location: cloudwatch:/crucible/holdout
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    # Declared, not defaulted (alpha-engine-config-I10970). It says exactly
    # what the sweep does for this row and no more: it grades this job's
    # FAILURES. Its absence is not graded and is not a defect - unsealing is a
    # reserved matter with no cadence - which is why `deadline` below is null.
    # This key was OMITTED until I10970 and the default manufactured the
    # string the board and the console rendered, so an operator was told
    # `holdout` was watched by a component nobody had named as its watcher.
    absence_watched_by: alerts.sweep
    # NEVER scheduled, and `deadline: null` is the load-bearing half: unsealing
    # is a RESERVED matter (principles.md 3.2), so there is no cadence this job
    # is expected to keep and no absence of it that is a defect. A deadline here
    # would page because a human did not unseal the holdout this week.
    schedule: null
    dispatch: null
    deadline: null

  experiment.new:
    description: Register an immutable arm from a recipe spec.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[arms/{slot}/register.jsonl],rows_in,rows_out
      outcome: run.json:metrics[arms_appended]
    log_location: cloudwatch:/crucible/experiment.new
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/arms
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  experiment.register:
    description: >-
      Register every arm recipe the release in force declares and the slot's
      register lacks. The set is DERIVED from the pinned release's strategy
      tree, never a hand-written list of arms; pinning the release is the
      deliberate act (alpha-engine-config-I10927).
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[arms/{slot}/register.jsonl],rows_in,rows_out,rows_rejected
      outcome: run.json:metrics[arm_recipes_registered]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/arms
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "11:00"

  experiment.run:
    description: Score one arm for one trading day.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd,llm_calls
      resource: run.json:resource
      lineage: run.json:inputs,outputs
      outcome: run.json:metrics[arm_score]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/arms
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "12:00"

  experiment.backfill:
    description: >-
      Produce one arm's history over a session range, point-in-time, through
      the slot's own per-arm produce path (alpha-engine-config-I10696). A
      stacked arm reads its base's prediction on every row of its training
      window, and a weekly arc adds one base session per week, so a 504-session
      window is unreachable from the schedule alone.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd,llm_calls
      resource: run.json:resource
      lineage: run.json:inputs,outputs,rows_in,rows_out,rows_rejected
      # A backfill produces no graded outcome of its own; the sessions it
      # writes are scored by experiment.grade like any other session.
      # Declared null rather than omitted.
      outcome: null
    log_location: cloudwatch:/crucible/experiment.backfill
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/arms
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    # On-demand, like data.heal: it repairs a HISTORY. A schedule here would
    # be a second producer of the artifacts the weekly arc already writes, so
    # there is no cadence for the deadline table to grade — its absence is
    # graded from the dispatcher's own record instead
    # (crucible.alerts.evaluate_dispatch_absence).
    schedule: null
    dispatch: null
    deadline: null

  experiment.grade:
    description: Run one slot's arena cycle — ladder, pairings, pointer, retirements.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs,outputs[arena_cycle]
      outcome: run.json:metrics[slot_leader_bound]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/slots
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "14:00"

  promote:
    description: Move a slot's champion pointer, evidence-gated.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[arena_cycle],outputs[champions/{slot}/current.json]
      outcome: run.json:metrics[pointer_moved]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/slots
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    # `alpha-engine-config-I9759`: promote is a STAGE of the weekly arc, not an
    # on-demand job. Until this row said so the v2 arena had never once written
    # a promote run or a champion pointer — `experiment.grade` decided, and
    # nothing acted on the decision — so all four §6 phase-3 promotion clauses
    # read UNMEASURABLE by construction: nothing had looked.
    #
    # 15:00, between `experiment.grade` at 14:00 and `report` at 16:00, because
    # the deadline table IS the dependency order (`crucible.weekly.arc_stages`):
    # promote reads the arena cycle grade wrote, and report reduces both.
    #
    # Slot-scoped (`crucible.weekly.ARC_SLOT_JOBS`), like `experiment.run` and
    # `experiment.grade`: four slots, one job name, one trading day, four
    # writers, so each files its own manifest under `runs/promote/{day}/{slot}/`.
    # The alternative — one combined run iterating the slots — makes the M
    # slot's `TrainingIntegrityError` (policy §3, a whole-slot failure by
    # design) take U, R and S's promotions down with it.
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "15:00"

  report:
    description: Reduce the week's manifests into the five-row attribution table.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**],outputs[report/{trading_day}/attribution.json]
      outcome: run.json:metrics[attribution_rows_complete]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/report
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "16:00"

  explain:
    description: Walk a run_id or verdict back to everything that produced it.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**]
      # A read-only lineage walk grades nothing.
      outcome: null
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    # alpha-engine-config-I10858. `_clause_explain_walks_a_verdict`
    # (`crucible/gate.py`) reads a ROLLING phase-1 window
    # (`_session_span`, currently ~31 calendar days) for an `explain` run
    # whose manifest walked a `verdict.json`. Until this row said `dispatch:
    # arc`, `explain` was purely on-demand (plan §10.8): nothing refreshed
    # the evidence, so the one manifest that ever qualified (2026-08-07)
    # aged out of the window with nothing behind it and phase 1 read UNMET
    # 5/6 on the 2026-09-15 07:30Z ladder. A rolling-window clause needs a
    # producer on a cadence SHORTER than its window — weekly, joining the
    # arc like `experiment.grade` and `promote`, is comfortably inside a
    # ~31-day span. `dispatch: arc` (not a standalone GHA workflow) mirrors
    # the established pattern for a weekly cadence
    # (`crucible.weekly.arc_stages` — six other rows already join this way)
    # rather than inventing a second scheduling mechanism, and it runs
    # under the SAME identity every other arc stage does (`RuntimeRole`,
    # the spot-job identity), which already holds read+list over
    # `crucible/experiments/*` (it WRITES the verdicts `experiment.grade`
    # produces) and read+write over `crucible/runs/*` — so this needed no
    # new IAM grant (verified against
    # nous-ergon-ops/infrastructure/cloudformation/crucible-v2.yaml
    # `RuntimeRole`'s `WriteEverythingThatIsNotARelease` and
    # `ListItsOwnPrefix` statements).
    #
    # `crucible.weekly.Stage.argv` appends `--select-newest-verdict`
    # (`crucible.weekly.SELECT_NEWEST_VERDICT_JOBS`) rather than naming a
    # target: `crucible.explain.select_newest_settled_verdict` picks the
    # newest SETTLED verdict.json across every slot deterministically and
    # raises `NoSettledVerdictError` (caught by `run_job`, filed as a
    # `failed` manifest) if none exists — never a silently empty walk.
    #
    # 17:15, after `console` (17:00, the arc's other last stage before this
    # one joined it) and before the arc's own 17:30 deadline
    # (`components.yaml`'s `weekly:` row — an arc deadline earlier than a
    # stage it runs would page for a run that was still working): the
    # freshest verdicts this week's `experiment.grade` run just wrote should
    # already be selectable, and `explain` reads no artifact any later stage
    # produces, so ordering it last costs nothing and avoids racing the
    # verdict it is about to select.
    #
    # `explain` remains callable on demand exactly as before — an operator
    # or agent target still runs `crucible explain <target>` with no
    # `--select-newest-verdict` — this row only adds a SECOND, scheduled
    # invocation shape; it does not narrow the first.
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "17:15"

  migrate.history:
    description: Import v1 arm history, flagged with its provenance.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs,outputs[arms/**]
      outcome: run.json:metrics[arms_migrated]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/arms
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    # `alpha-engine-config-I10961` deliverable 4. This was `schedule: null` /
    # `dispatch: null` — scheduled nowhere — so the `slots=("u","r")` deferral
    # that left M out had no trigger at all: it expired on 2026-09-17 when M's
    # arms arrived, and nothing went red and nothing ran. A default cannot
    # expire; an arc stage evaluating `crucible.migrate.admission_refusal`
    # against the live store every Saturday can.
    #
    # 14:30, between `experiment.grade` at 14:00 and `promote` at 15:00,
    # because the deadline table IS the dependency order
    # (`crucible.weekly.arc_stages`). Both sides are real dependencies, not a
    # preference:
    #
    #   * AFTER grade — the admission predicate is PRODUCTION, not
    #     registration (`crucible.migrate.admission_refusal`): a slot is seated
    #     only once its arm has actually produced, and `experiment.run` at
    #     12:00 plus `experiment.grade` at 14:00 are what make that true for
    #     the week. Running earlier would defer every slot whose first
    #     production is this cycle's.
    #   * BEFORE promote — `champions/{slot}/current.json` has exactly two
    #     writers, this job and `promote`, and this one only ever seats an
    #     ABSENT pointer. Seating v1's lineage after promote had written its
    #     own would be refused (correctly), and v1's served chain would be
    #     unrecoverable from the v2 store — which is the loss this job exists
    #     to prevent.
    #
    # A slot that is not admissible is recorded `deferred` with its reason and
    # the run still exits `ok`, so this stage cannot kill the nine after it
    # (`crucible-PR317` / `alpha-engine-config-I10927`).
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "14:30"

  release.pin:
    description: Repoint releases/current, or pin the trader to a release.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[releases/current]
      outcome: null
    log_location: cloudwatch:/crucible/release.pin
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/releases
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  release.lock:
    description: >-
      Apply Object Lock retention to a published release's identity objects
      (alpha-engine-config-I9898) — the repair for a release published before
      the write-time fix (I9787).
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:metrics[release_object_retention]
      outcome: run.json:metrics[release_objects_locked]
    log_location: cloudwatch:/crucible/release.lock
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/releases
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  smoke:
    description: A real end-to-end run against live data that gates a release flip.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs,outputs
      outcome: run.json:metrics[smoke_ok]
    log_location: cloudwatch:/crucible/smoke
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/releases
    artifact_retention: forever
    # Runs on every merge to main, which is wall-clock, not scheduled work
    # whose absence is a fact about the system.
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  # ── Track C (alpha-engine-config-I9757) ────────────────────────────────
  # The four rows below are the observing surfaces themselves. Two of them
  # cannot be watched by the sweep — one IS the sweep, and the other is what
  # stands behind it when the sweep is dead — so both name a different
  # watcher, and tests/test_components_registry.py refuses any row whose
  # absence is watched by itself.

  alerts.sweep:
    description: >-
      Evaluate the two page conditions over every scheduled row, group by
      cause, page once per group, and write the alerts bus rows.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**],outputs[alerts/**]
      outcome: run.json:metrics[pages_emitted]
    log_location: cloudwatch:/crucible/alerts.sweep
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/alerts
    artifact_retention: forever
    # The one row the sweep cannot honestly watch: a sweep that never ran
    # cannot report itself missing. The weekly heartbeat is what stands
    # behind it.
    #
    # An earlier version of this comment added "and a sweep run DOES report
    # the previous day's sweep, so the self-reference is a lag rather than a
    # blind spot". That was never true — `heartbeat()` did not read this row's
    # manifest at all, so the declared watcher watched nothing and the row read
    # as covered. crucible-PR17 makes the heartbeat actually evaluate it.
    absence_watched_by: heartbeat
    schedule: daily 21:00 ET, every calendar day
    dispatch: scheduler
    deadline:
      anchor: close_plus
      cadence: daily
      offset_hours: 5.5

  heartbeat:
    description: >-
      The weekly proof that the alerting path itself is alive - "v2 alive, N
      runs ok, $X". Not a third page condition; its ABSENCE is the signal.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**],outputs[alerts/**]
      outcome: run.json:metrics[pages_last_28_trading_days]
    log_location: cloudwatch:/crucible/heartbeat
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/alerts
    artifact_retention: forever
    # Deliberately a human, and the only row in the file that says so. If
    # the whole alerting path is dead the sweep is dead too, so a machine
    # watcher here would be watching from inside the thing that failed. The
    # operator noticing no Saturday message is the outer loop, and naming it
    # is what keeps it from being mistaken for coverage that does not exist.
    absence_watched_by: operator
    schedule: weekly, Saturday
    dispatch: scheduler
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "18:00"

  drift:
    description: >-
      Feature PSI against the training window, prediction-distribution drift,
      and IC decay by horizon - three MetricRecords with control bands.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[features/**,predictions/**],outputs[drift/**]
      outcome: run.json:metrics[feature_psi_max_ratio]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/drift
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "15:00"

  board:
    description: >-
      Render the fully-declared board - every plan §2 objective, every §6 phase
      gate, every registry component and the four cutover predicates, each in
      one of seven typed states.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**,gates/**,report/**,arms/**],outputs[board/index.html,board/current.json]
      # `schedule_milestones_overdue` added alpha-engine-config-I9914: the
      # plan §6.1 milestone rows' own outcome signal, so a missed schedule
      # date is a graded figure on this row rather than only a text detail
      # inside `board_rows_red`.
      outcome: run.json:metrics[board_rows_unmeasurable,schedule_milestones_overdue]
    log_location: github-actions:board.yml
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/board
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    # DAILY, and not `arc`. The weekly driver is phase-2 work
    # (alpha-engine-config-I9758); a board dispatched by it would go dark for
    # the whole of phase 0 and phase 1 - which are exactly the phases whose
    # gaps this instrument exists to render. It is also why `dispatch: arc`
    # would be wrong even though `console` is: six rows in this file once read
    # "weekly, Saturday" while exactly one of them was dispatched by anything.
    #
    # `github-actions`, not `scheduler`: the starter is the `on.schedule`
    # cron in .github/workflows/board.yml (`30 21 * * *`), and there is no
    # AWS::Scheduler::Schedule for this job. This row read `scheduler` from
    # 2026-09-02T21:47Z until alpha-engine-config-I9878, which is a row
    # naming a starter that does not exist - the same blindness the field
    # exists to remove, one layer up. The GHA cron is the RIGHT dispatcher
    # here: board.yml already holds the narrowly-scoped OIDC BoardRole, and
    # converting the job to a Lambda to satisfy a field value would be
    # shaping the system around the guard. GitHub drops scheduled events
    # under load (measured on this fleet: a `*/30` workflow ran 5-8x/day for
    # its whole life), which is why `absence_watched_by: alerts.sweep` above
    # is load-bearing on this row - the page fires on the missing artifact,
    # never on trusting the cron.
    #
    # Since alpha-engine-config-I10872 the cron is a FLOOR: board.yml also
    # renders on completion of `gate-close.yml` (`workflow_run`), so the board
    # `report.morning` delivers postdates the day's gate reading. `dispatch`
    # stays `github-actions` / `board.yml`; both starters live in that file.
    schedule: daily
    dispatch: github-actions
    dispatch_workflow: board.yml
    deadline:
      anchor: close_plus
      cadence: daily
      offset_hours: 6

  console:
    description: >-
      Render the static console page from the manifests - the plan §6 phase
      ladder as gates/ladder.json publishes it (READ, never recomputed and
      never republished - alpha-engine-config-I10575), runs with their
      14-state classification, attribution, champions, week cost, deploys.
      Also renders the PUBLIC surface (public/index.html + .json,
      alpha-engine-config-I10223) from the same read of the store - a separate
      projection carrying no alpha figure, no cost and no infrastructure
      identifier, never a second copy of the operator page.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**,gates/**,gates/ladder.json,board/current.json,arena/**,champions/**,report/**],outputs[console/index.html,public/index.html]
      outcome: run.json:metrics[components_unreported]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/index
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      anchor: next_calendar_day_at
      cadence: weekly
      at: "17:00"

  iac.conformance:
    description: >-
      Two independent IaC conformance readings: (a) live AWS resources
      tagged system=crucible-v2 vs what the deployed template declares,
      and (b) the deployed template vs the plan's own declared resource
      and role inventory (alpha-engine-config-I10418). A finding pages
      only once it persists two consecutive weekly cycles.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[iac/{trading_day}/conformance.json]
      outcome: run.json:metrics[iac_conformance_persisted]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    dispatch: arc
    deadline:
      # Between `console` (17:00) and `weekly`'s own deadline (17:30) — see
      # that row's comment: the arc's own deadline must be no earlier than
      # any stage it runs, so this cannot land at or after 17:30.
      anchor: next_calendar_day_at
      cadence: weekly
      at: "17:15"

  # ── Track F (alpha-engine-config-I9757) ────────────────────────────────

  weekly:
    description: >-
      Run the declared weekly arc for one trading day, in deadline order,
      stopping at the first stage that fails.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**]
      outcome: run.json:metrics[arc_stages_completed]
    log_location: cloudwatch:/crucible/weekly
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: weekly, Saturday
    # The one row the arc cannot dispatch: it IS the arc.
    dispatch: scheduler
    deadline:
      # Later than `console`, its own last stage. An arc deadline earlier
      # than a stage it runs would page for a run that was still working.
      anchor: next_calendar_day_at
      cadence: weekly
      at: "17:30"

  gate:
    description: >-
      Read the manifests a phase produced and report, clause by clause,
      whether that phase's exit gate is met.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[runs/**,report/**,arena/**],outputs[gates/**]
      outcome: run.json:metrics[gate_clauses_met_ratio]
    log_location: github-actions:gate-close.yml
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/gates
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    # DAILY since alpha-engine-config-I10508, and the earlier argument for
    # `null` is recorded here rather than deleted, because it was right about
    # something else.
    #
    # It read: "run at a phase exit, which is an event and not a cadence; a
    # gate on a schedule would be a gate whose absence pages between phases."
    # That is an argument about a gate as a DECISION - nobody should be paged
    # because no phase exited today, and nothing here does that: `crucible
    # gate` exits 1 on an unmet gate and the publish job treats that as the
    # ordinary case.
    #
    # It was never an argument about the ARTIFACT. `gates/{gate}/{day}/gate.json`
    # is a dated reading other surfaces consume - `crucible/board.py`'s
    # `phase:{id}:earliest-satisfiable` row reads the PREVIOUS trading day's
    # to detect a setback - and I10492 left it with no producer at all, so it
    # simply stopped being refreshed while remaining perfectly readable. An
    # old reading is indistinguishable from a current one; the only thing
    # separating them is a date in a key nobody compares. A surface kept fresh
    # by whoever happens to run a command is the defect one layer along, which
    # is the same sentence `gate.close` below was created for.
    #
    # So the READING is now published on a cadence too, by the `gate-publish`
    # job of .github/workflows/gate-close.yml, under its own THIRD identity -
    # the gate-publish role, which may write the dated readings
    # and the ladder and may never write `gates/*/closing.json`. The deadline
    # below is what makes its absence a page rather than a silence, and
    # `crucible/board.py`'s `gate-readings-fresh` row renders the same fact on
    # the daily board.
    schedule: daily
    dispatch: github-actions
    dispatch_workflow: gate-close.yml
    deadline:
      # Identical to `gate.close`'s below, and for the identical reason: both
      # jobs are started by the SAME 23:00 UTC cron in the same workflow, so
      # they share this account's measured GitHub Actions delivery envelope
      # (chronically +240 to +304 minutes - alpha-engine-config-I9960,
      # -I9966). 23:00Z + 304 min is 04:04Z; `close_plus 10` is 02:00 ET the
      # following morning, which clears the worst measured delay with ~2h of
      # headroom. A tighter deadline here would page on a run that was merely
      # late, which is how a channel gets muted.
      anchor: close_plus
      cadence: daily
      offset_hours: 10

  gate.close:
    description: >-
      Read every registered phase's exit gate and file the one durable closing
      record for each phase that reads MET and has none.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      # `outputs[gates/*/closing.json]` and nothing wider, deliberately: this
      # job writes closing records and its own manifest, never a dated gate
      # reading. The IAM grant says the same thing
      # (nous-ergon-ops/infrastructure/cloudformation/crucible-v2.yaml,
      # GateCloseRole), so a bug that tried to publish a reading from here is
      # an AccessDenied rather than a grading surface authoring what it grades.
      lineage: run.json:inputs[runs/**,report/**,arena/**,gates/**],outputs[gates/*/closing.json]
      outcome: run.json:metrics[closing_records_filed,phases_met_without_a_record]
    log_location: github-actions:gate-close.yml
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/gates
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    # DAILY, and not `arc`, for the same reason `board` is daily: the weekly
    # driver is phase-2 work (alpha-engine-config-I9758), and a filing job
    # dispatched by it would go dark for phases 0 and 1 - the two phases whose
    # exits this job exists to record. It is also why it is a job of its own
    # rather than a stage of `board`: the board is rendered by a READ-ONLY
    # identity on purpose, and a grading surface that could file the record
    # satisfying the clause it grades is not a measurement.
    #
    # `github-actions`, like `board`: the starter is the `on.schedule` cron in
    # .github/workflows/gate-close.yml, and no AWS::Scheduler::Schedule
    # dispatches it. `nous-ergon-ops/tests/crossrepo/test_crucible_dispatch_lockstep.py`
    # checks that naming in BOTH directions - this row may not name a workflow
    # that carries no cron, and a cron workflow may not go unnamed here.
    # GitHub drops scheduled events under load, which is what makes
    # `absence_watched_by: alerts.sweep` load-bearing: the page fires on the
    # missing manifest, never on trusting the cron.
    schedule: daily
    dispatch: github-actions
    dispatch_workflow: gate-close.yml
    deadline:
      # `close_plus 10` = 02:00 ET the following morning (06:00 UTC in EDT,
      # 07:00 in EST), from the cron at 23:00 UTC plus this ACCOUNT's measured
      # GitHub Actions delivery envelope - chronically +240 to +304 minutes,
      # the four-workflow measurement recorded on `report.morning`'s deadline
      # below (alpha-engine-config-I9960, -I9966). 23:00Z + 304 min is 04:04Z,
      # so this clears the worst measured delay with ~2h of headroom while
      # still paging the same morning on a genuine no-show. A tighter deadline
      # here would page on a run that was merely late, which is how a channel
      # gets muted.
      anchor: close_plus
      cadence: daily
      offset_hours: 10

  report.morning:
    description: >-
      Read the board rendered by board.yml and deliver its reading to the
      operator channel near 06:00 PT (delivered instant; the cron below
      declares 03:00 PT so the account's measured GitHub Actions delivery
      lag lands it near 06:00 PT — alpha-engine-config-I9966). Reads; never
      renders and never runs.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[board/current.json,board/**,runs/board/**,gates/ladder.json],outputs[runs/report.morning/**]
      outcome: run.json:metrics[morning_report_delivered]
    log_location: github-actions:morning-report.yml
    log_retention_days: 90
    # NOT the pages channel, and this is the whole design constraint. Plan
    # §4.6 admits exactly two page conditions - absence and failure - and a
    # daily digest is neither; it is "a row on a page nobody is paged to".
    # It reaches the same Telegram bot on `severity: info` with `silent`
    # set and SNS off, so it never travels the path a page travels and
    # cannot buzz a phone at 6am about a board that is red by design.
    # `alert_channel` here is what pages about THIS ROW - an absent or
    # failed report - and that is a real page on the real channel.
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: daily 10:00 UTC (03:00 PDT / 02:00 PST)
    dispatch: github-actions
    dispatch_workflow: morning-report.yml
    # `next_calendar_day_at`, not `close_plus`: the report for trading day d
    # is delivered on the calendar day AFTER d, before that day's session
    # opens. 10:00 UTC is 06:00 ET in EDT and 05:00 ET in EST.
    #
    # Corrected 2026-09-06 (alpha-engine-config-I9966, recalibration noted on
    # that issue): the cron moved from `0 13 * * *` (09:00 ET) to
    # `0 10 * * *` (06:00 ET) — `crucible.morning.DELIVERY_CRON_UTC`, the one
    # source of truth the workflow-shape test in `tests/test_morning.py`
    # reads back against `.github/workflows/morning-report.yml` — because
    # GitHub was delivering the OLD cron 3-5h after its declared instant, so
    # a cron declaring 06:00 PT was landing near 09:07 PT. The DEADLINE below
    # moves by the same three hours, so the margin it gives the account's
    # measured delivery lag is unchanged; only the two ends of the window
    # shifted.
    #
    # 12:00 ET, from this ACCOUNT's measured cron-delivery envelope
    # (alpha-engine-config-I9960, -I9966), not from crucible's own single
    # sample. The first cut of this deadline (12:30 ET / 210 minutes, against
    # the OLD 09:00 ET occurrence) was set from `board.yml`'s one recorded
    # firing — cron `30 21 * * *`, due 2026-09-03T21:30Z, ran at
    # 2026-09-03T23:23:13Z, 113 minutes late — and that sample is this
    # account's *best* case, not a representative one. Four
    # `nous-ergon-ops` GitHub Actions crons, each declaring exactly one
    # schedule, measured on 2026-09-04:
    #
    #   workflow                   declared      actual        delay
    #   authority-surface          07:00Z        12:04:45Z     +304 min
    #   llm-callsite-surface       07:30Z        12:11:00Z     +281 min
    #   observability-registry     07:30Z        12:10:51Z     +280 min
    #   cloudwatch-alarm-drift     09:45Z        13:46:19Z     +241 min
    #
    # and it is chronic, not a bad day: `0 7 * * *` landed at 12:02-12:05Z on
    # each of 2026-09-02, -03 and -04. Three of those four delays exceed
    # 210 minutes, so a 210-minute deadline would have paged on a report that
    # was merely late, not absent — a false alarm on most days trains the
    # reader to ignore the one true page, which is the exact failure this
    # detector exists to prevent.
    #
    # 12:00 ET (16:00Z in EDT, 17:00Z in EST) is 360 minutes after the EDT
    # occurrence (06:00 ET) and 420 after the EST one (05:00 ET) — the SAME
    # 360/420-minute margin the pre-recalibration 15:00 ET deadline gave the
    # OLD 09:00/08:00 ET occurrence, so this still clears the worst measured
    # delay (304 min) with ~56 minutes of headroom, while still paging the
    # same calendar day on a genuine no-show.
    #
    # This constant is calibrated to THIS ACCOUNT's GitHub Actions delivery
    # behaviour, not a universal or vendor-documented figure. If that
    # envelope moves, re-measuring it — not adjusting this number on
    # preference — is the maintenance action; re-run the four-workflow
    # measurement above and update both the table and `at:`. If the cron
    # (`DELIVERY_CRON_UTC`) ever moves again, shift this `at:` by the same
    # number of hours so the margin stays 360/420 minutes.
    deadline:
      anchor: next_calendar_day_at
      cadence: daily
      at: "12:00"

  fault.probe:
    # alpha-engine-config-I10343: the INDUCER for plan §10.7 fault 3. Reaches
    # the router once through the declared door, asking for a capability class
    # whose group is contracted never to serve, so the run fails on the
    # transport with full telemetry and pages exactly once. On-demand, like
    # fault.record — a job that can only ever fail would, on a schedule, page
    # every cycle forever, and the two page conditions have a monthly ceiling
    # that is itself a metric.
    description: Induce a router transport failure on the real dispatched path (fault 3).
    lifecycle: ACTIVE
    signals:
      execution: run.json
      # Always 0.00. The probe's class never serves, so no completion exists
      # to be billed; the field is declared because a cost class that reads
      # zero is a measurement, and an omitted one is a forgotten instrument.
      cost: run.json:cost_usd
      resource: run.json:resource
      # It writes no artifact at all: filing the durable record is
      # fault.record's separate, deliberate act, which re-reads THIS manifest
      # and refuses unless it says `status: failed`. Declared null rather than
      # omitted, same as data.heal's outcome.
      lineage: null
      # No graded outcome of its own — the fault RECORD carries the claim, and
      # this job is the event the record is about.
      outcome: null
    log_location: cloudwatch:/crucible/fault.probe
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  fault.record:
    # alpha-engine-config-I10320/-I10322/-I10327: files the durable record of
    # one scripted fault (plan §10.7) exercised against the real scheduled
    # path — induced (the job failed), absorbed (the declared transient class
    # handled it) or unreachable (the state cannot be entered). On-demand,
    # like data.heal and experiment.new — an operator/procedure runs it once
    # per fault exercised, never on a schedule.
    description: File the durable record of one exercised scripted fault, or refuse.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[faults/{trading_day}/{fault_id}.json]
      # A fault record makes no graded outcome claim of its own — it is
      # evidence ABOUT a run, not a verdict. Declared null rather than
      # omitted, same as data.heal.
      outcome: null
    log_location: cloudwatch:/crucible/fault.record
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  test.integration:
    # alpha-engine-config-I10459: promotes the integration tier's summary
    # artifact from a hand-rolled `store.put_bytes` call inside
    # `.github/workflows/integration-nightly.yml` to a real registered job.
    # `schedule`/`dispatch`/`deadline` are all null on purpose — this stays
    # WORKFLOW-triggered by that workflow's own `schedule`/`workflow_call`/
    # `workflow_dispatch` triggers, never a second, independent
    # EventBridge/spot-dispatched starter for the same nightly run.
    description: Run tests/integration (real S3 + real ArcticDB) and report pass/fail.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      # Writes nothing of its own beside its manifest — the artifacts
      # `tests/integration` itself produces belong to THEIR OWN jobs'
      # lineage (each case invokes `crucible.cli.main` for real), not to
      # this summarizing job's.
      lineage: null
      outcome: run.json:metrics[tests_integration_exit_code]
    log_location: github-actions:integration-nightly.yml
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  review.record:
    # alpha-engine-config-I10968, the same class as `test.integration`
    # (-I10459) one call site on. `python -m crucible.review record` wrote
    # `reviews/{phase}/{day}/{reviewer}/{verdict}.json` from a raw
    # `store.put_bytes` in its own `__main__` — no manifest on either path and
    # no row here — while `crucible.gate._clause_independently_reviewed` reads
    # that artifact as phase-exit evidence. It is a registered job now, and
    # `crucible/review.py`'s own entry point keeps only the two verbs that
    # write nothing (`authors`, `check`), which is what lets the recording
    # workflow refuse a self-review BEFORE it asks for AWS credentials.
    #
    # `schedule`/`dispatch`/`deadline` all null: the verdict is recorded when a
    # review happens, which is an operator dispatch of
    # `adversarial-review-record.yml`, never a clock. A deadline would page for
    # a day nobody reviewed anything.
    description: File one independent adversarial review verdict in the store.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[reviews/{phase}/{day}/{reviewer}/{verdict}.json]
      # The job records a verdict; it does not grade one. What it can fail on
      # is the independence comparison, and that is the manifest's own
      # `status`/`reason` — a metric restating it would be a second rendering
      # of one fact.
      outcome: null
    log_location: github-actions:adversarial-review-record.yml
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  acceptance.publish:
    # alpha-engine-config-I10968, the second writer. `ci.yml` copied the plan
    # §12 rule-3 acceptance reading to the store with a raw `aws s3 cp` — not
    # through `crucible.store.Store` at all — so the ONE producer of the figure
    # the plan names as progress filed no manifest, while `crucible
    # report.morning`, `crucible board` and phase 0's own gate clause all read
    # it as evidence.
    #
    # `schedule`/`dispatch`/`deadline` all null: it runs on `ci.yml`'s
    # `push`/`pull_request` triggers. A deadline would page for a day nobody
    # merged anything, which is a fact about the week, not about this job.
    description: Publish the plan section 12 rule-3 acceptance reading a commit measured.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[report/acceptance/{day}.json]
      outcome: run.json:metrics[acceptance_clauses_met]
    log_location: github-actions:ci.yml
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  trader.reconcile:
    # alpha-engine-config-I10651 / -I10413. The daily broker reconciliation,
    # run by the TRADER (nousergon/crucible-trader, crucible-trader-PR5) under
    # its own identity through `crucible.runner.run_job`. NOT a
    # `crucible.cli.JOBS` entry - the harness may not reach into the trader
    # (plan section 3) - so this row is admitted by
    # `crucible.models.TRADER_JOB_VALUES`, the declared set of trader jobs,
    # and `tests/test_components_registry.py` derives coverage from JOBS plus
    # that tuple rather than exempting a name.
    #
    # ACTIVE, so the FAILURE page is live the moment a manifest lands: a
    # discrepancy or a missed planted discrepancy makes the run `failed`,
    # which is the page (section 4.6), naming instrument, delta and side.
    #
    # `schedule`/`dispatch`/`deadline` are null ON PURPOSE, today: nothing
    # starts this job yet (I10651's 2026-09-14 comment - no box entry point, no
    # fills source, no genesis run). A daily `close_plus` deadline declared
    # before anything dispatches the job would page ABSENCE every trading day
    # for a job nobody started, which is how a channel gets muted. The change
    # that schedules it sets `schedule: daily`, its `dispatch`, and the
    # deadline in the same edit; `test_a_scheduled_job_declares_a_deadline`
    # refuses the schedule without the deadline.
    description: >-
      Reconcile the trader's positions and cash against the broker, with a
      planted-discrepancy control arm (fault 5); any discrepancy is a page.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs[trader/broker_statements/**],outputs[trader/broker_statements/*,trader/reconciliation/*]
      outcome: run.json:metrics[broker_reconciliation_match_rate,broker_reconciliation_discrepancies,broker_reconciliation_position_count_delta,broker_reconciliation_cash_residual_usd,broker_reconciliation_control_detected]
    log_location: cloudwatch:/crucible/trader.reconcile
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  trader.smoke:
    # alpha-engine-config-I10649. The trader's own IB-paper smoke (install the
    # pinned wheel, connect to the paper gateway, read the book, place no
    # order), run by the TRADER under its own identity. Its `ok` manifest for a
    # sha is the evidence `crucible release.pin --target trader` requires
    # (crucible-PR294, `crucible.release.TRADER_SMOKE_JOB`). Admitted by
    # `crucible.models.TRADER_JOB_VALUES` for the reason `trader.reconcile`
    # above is. On demand - it runs before a pin, never on a clock - so no
    # schedule and no deadline; ACTIVE so a failed smoke pages.
    description: >-
      The trader's IB-paper smoke for one release sha; its ok manifest gates
      the trader release pin.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: null
      outcome: null
    log_location: cloudwatch:/crucible/trader.smoke
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  trader.kill_switch:
    # alpha-engine-config-I10650 deliverable 1. The trader's kill switch
    # (crucible-trader-PR7, `crucible_trader.kill_switch`): one command
    # flattens or freezes the paper book, or releases the halt. Run by the
    # TRADER under its own identity; admitted by
    # `crucible.models.TRADER_JOB_VALUES` for the reason `trader.reconcile` is.
    #
    # On demand - a human or an incident fires it, never a clock - so no
    # schedule and no deadline: a deadline would page ABSENCE on every day the
    # switch was, correctly, not fired. ACTIVE so a fire whose book did not
    # settle inside its bound, or that let an order through, pages
    # (`KillSwitchNotSettledError` makes the run `failed`).
    description: >-
      Flatten or freeze the trader's paper book, or release the halt; a fire
      that does not settle inside its bound is a page.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[trader/kill_switch.json,trader/kill_switch/events/*]
      outcome: run.json:metrics[kill_switch_settle_seconds]
    log_location: cloudwatch:/crucible/trader.kill_switch
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  trader.fire_drill:
    # alpha-engine-config-I10650 deliverables 2 and 5. The kill switch or the
    # hold-book safeguard fired on purpose against the paper book during
    # regular hours (crucible-trader-PR7, `crucible_trader.fire_drill`). Its
    # `fire_drill.v1` output is what
    # `crucible.gate._clause_kill_switch_fire_drill_passed` grades for phase 4.
    #
    # On demand - and deliberately never on a clock, since an unannounced
    # drill that a schedule could predict is an announced one - so no
    # schedule and no deadline. ACTIVE so a drill that did not pass pages
    # (`FireDrillFailedError` makes the run `failed`).
    description: >-
      Fire the kill switch or hold-book safeguard on paper and record whether
      the book reached its target inside the bound with no order let through.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[trader/kill_switch.json,trader/fire_drills/*]
      outcome: run.json:metrics[fire_drill_passed]
    log_location: cloudwatch:/crucible/trader.fire_drill
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  trader.session:
    # alpha-engine-config-I11545 (Brian's rulings of 2026-09-24: the v2 trader
    # runs on the executor box; a shadow session counts as a served day). One
    # trading session on the M champion, run by the TRADER under its own
    # identity (`crucible_trader.shadow_session`): resolve the two-document
    # contract, build the book through `crucible.portfolio`, record the day in
    # `trader/evidence.json` with its session mode, and file the session's
    # `execution_shortfall.v1` (`no_orders` for a shadow session) as run outputs. Admitted by
    # `crucible.models.TRADER_JOB_VALUES` for the reason `trader.reconcile` is.
    #
    # `schedule`/`dispatch`/`deadline` are null for the reason they are on
    # `trader.reconcile`: the box timer exists, but nothing it runs can reach
    # this store until the executor role's v2 grants are applied and a trader
    # release is pinned, and a `close_plus` deadline declared before then
    # would page ABSENCE every trading day for a job that cannot yet start.
    # The change that proves the first unattended run sets all three.
    description: >-
      Serve one trading session on the M champion (shadow until an order
      router exists) and record the served day, with its session mode, in the
      trader's consumer evidence.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:outputs[trader/evidence.json,trader/execution_shortfall/*]
      outcome: run.json:metrics[portfolio_construction,hold_book_engaged]
    log_location: cloudwatch:/crucible/trader.session
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/runs
    artifact_retention: forever
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null

  deploy:
    # alpha-engine-config-I10969. The component that moves `releases/current`
    # - the single most consequential mutation in the v2 system, and the one
    # thing that decides which code every spot box and the trader actually
    # run. It writes a real `run_manifest.v2` document at
    # `runs/deploy/{trading_day}/run.json` on both paths and had NO row here
    # until I10969: the manifest schema's `job` enum carried it, this file did
    # not, and the difference was asserted as a bare literal in
    # `tests/test_components_registry.py`. That literal is now
    # `crucible.models.WORKFLOW_JOB_VALUES`, checked in both directions the
    # way the trader half already was.
    #
    # NOT a `crucible.cli.JOBS` entry and must never become one -
    # `crucible/deploy.py`'s module docstring states why: putting it behind
    # `crucible <job>` would give every runtime identity a subcommand it must
    # never be able to execute.
    #
    # `dispatch: null` is the honest value and `dispatch: github-actions` is
    # the wrong reach: a deploy is triggered by a MERGE to main, which is
    # neither a cron nor the arc, and
    # `nous-ergon-ops/tests/crossrepo/test_crucible_dispatch_lockstep.py`
    # requires every `github-actions` row to name a `dispatch_workflow` that
    # declares an `on.schedule` cron. `deploy.yml` has none.
    description: >-
      Flip releases/current to a pinned, smoke-gated sha - the mutation that
      decides which code every box and the trader run.
    lifecycle: ACTIVE
    signals:
      execution: run.json
      cost: run.json:cost_usd
      resource: run.json:resource
      lineage: run.json:inputs,outputs[releases/current,releases/history/*]
      # A deploy grades nothing; the smoke that gates it does. Declared null
      # rather than omitted, same as data.heal's outcome.
      outcome: null
    log_location: github-actions:deploy.yml
    log_retention_days: 90
    alert_channel: telegram:crucible-pages
    console_surface: crucible/releases
    artifact_retention: forever
    # The sweep grades this row's FAILURES. Its absence is not graded and is
    # not a defect: there is no cadence at which a deploy is owed, because a
    # deploy happens when a merge happens.
    # `test_exactly_one_row_is_watched_by_a_human_and_it_is_the_heartbeat`
    # forbids `operator` here.
    absence_watched_by: alerts.sweep
    schedule: null
    dispatch: null
    deadline: null
